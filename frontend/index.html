<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navrist Research Terminal</title>
    <script>
        // Pre-paint theme: apply the last choice saved on this computer before the
        // first paint so there is no flash. Default is light (no user accounts, so
        // persistence is per-browser). Mirrors getInitialTheme() in ThemeToggle.jsx.
        (function () {
            try {
                var t = localStorage.getItem('navrist_theme');
                if (t === 'dark') document.documentElement.classList.add('dark');
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563EB'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='18' fill='white'>N</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen overflow-x-hidden bg-transparent text-slate-300 relative selection:bg-blue-500/20 selection:text-blue-900">
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var el = document.getElementById('root');
            if (el) el.innerHTML = '<div style="color:red;padding:40px;font-size:14px;font-family:monospace;white-space:pre-wrap"><h2>JavaScript Error</h2>' + msg + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\n\n' + (error ? error.stack : '') + '</div>';
            console.error('CAUGHT ERROR:', msg, 'at line', lineNo, 'col', columnNo, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            var el = document.getElementById('root');
            if (el) el.innerHTML = '<div style="color:orange;padding:40px;font-size:14px;font-family:monospace;white-space:pre-wrap"><h2>Unhandled Promise Rejection</h2>' + event.reason + '</div>';
        });
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
