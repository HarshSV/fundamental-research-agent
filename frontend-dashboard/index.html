                    </div>
                </div>
            );
        };

        // --- SUBCOMPONENT: Forensic Checklist checks cards ---
        const ForensicChecklist = ({ parsedJson, checklistItems = [] }) => {
            const f16 = parsedJson?.['F-16'] || {};
            const riskLevel = f16.risk_level || 'Low';
            // Aggregate EVERY red/amber flag investors look for — forensic accounting
            // checks + the investor-checklist items — red flags first. Green passes hidden.
            // Defensive: LLM payloads occasionally deliver objects where strings
            // are expected — rendering an object as a React child crashes the app.
            const asText = (v) => v == null ? '' : typeof v === 'string' ? v
                : typeof v === 'object' ? Object.values(v).filter(Boolean).join(' — ') : String(v);
            const forensic = (f16.checks || [])
                .filter(c => String(c.status).toUpperCase() !== 'PASS')
                .map(c => ({ title: asText(c.name), status: String(c.status).toUpperCase() === 'FAIL' ? 'RED FLAG' : 'WATCH', detail: asText(c.details), cat: 'Forensic accounting' }));
            const fromChecklist = (checklistItems || [])
                .filter(it => it.status === 'RED FLAG' || it.status === 'WATCH')
                .map(it => ({ title: asText(it.question), status: it.status, detail: asText(it.evidence), cat: asText(it.category) }));
            const seen = new Set();
            let flags = [...forensic, ...fromChecklist].filter(f => { const k = f.title; if (seen.has(k)) return false; seen.add(k); return true; });
            flags.sort((a, b) => (b.status === 'RED FLAG' ? 1 : 0) - (a.status === 'RED FLAG' ? 1 : 0));
            const redCount = flags.filter(f => f.status === 'RED FLAG').length;
            const watchCount = flags.length - redCount;

            return (
                <div className="p-5 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3 flex-wrap gap-2">
                        <div>
                            <h4 className="font-heading text-sm font-bold text-slate-200 uppercase tracking-wider">Red Flags &amp; Watch-Items</h4>
                            <p className="text-[10px] text-slate-500 mt-0.5">Everything an investor should check last — accounting quality, governance, leverage &amp; concentration.</p>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <span className="text-[10px] font-bold border rounded-md px-2 py-1 bg-red-500/10 text-red-400 border-red-500/25">{redCount} Red</span>
                            <span className="text-[10px] font-bold border rounded-md px-2 py-1 bg-amber-500/10 text-amber-400 border-amber-500/25">{watchCount} Watch</span>
                        </div>
                    </div>

                    {flags.length === 0 ? (
                        <div className="p-4 text-center text-[11px] text-slate-400">No red flags or watch-items surfaced across the accounting, governance and leverage checks.</div>
                    ) : (
                        <div className="max-h-[430px] overflow-y-auto pr-1">
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2.5">
                                {flags.map((f, i) => {
                                    const red = f.status === 'RED FLAG';
                                    return (
                                        <div key={i} className={`p-2.5 rounded-lg border ${red ? 'bg-red-500/5 border-red-500/25' : 'bg-amber-500/5 border-amber-500/20'}`}>
                                            <div className="flex items-start justify-between gap-1.5 mb-1">
                                                <span className="text-[11px] font-bold text-slate-100 leading-tight">{f.title}</span>
                                                <span className={`text-[8px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded flex-shrink-0 ${red ? 'bg-red-500 text-white' : 'bg-amber-500 text-slate-900'}`}>{red ? 'Red' : 'Watch'}</span>
                                            </div>
                                            {f.cat && <div className="text-[8px] uppercase tracking-wider text-slate-500 font-bold mb-1">{f.cat}</div>}
                                            <p className="text-[10px] text-slate-300 leading-snug">{f.detail}</p>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- Expandable methodology block: OPEN by default (transparency-first),
        // with a toggle to collapse. Replaces <details> (React re-renders kept
        // forcing native details back open). ---
        const Expandable = ({ title, defaultOpen = true, children }) => {
            const [open, setOpen] = useState(defaultOpen);
            return (
                <div className="p-3 bg-slate-900/60 border border-slate-800 rounded-lg">
                    <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between text-left">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 hover:text-slate-200">{title}</span>
                        <span className="text-[10px] font-bold text-blue-300">{open ? 'Hide ▴' : 'Show ▾'}</span>
                    </button>
                    {open && <div className="mt-2">{children}</div>}
                </div>
            );
        };

        // --- Long text clamped to a few lines with a Read more toggle ---
        const ClampText = ({ text, className = '' }) => {
            const [open, setOpen] = useState(false);
            if (!text) return null;
            const isLong = String(text).length > 280;
            return (
                <div className={className}>
                    <p className={`text-[11px] text-slate-400 leading-relaxed ${(!open && isLong) ? 'line-clamp-3' : ''}`}>{text}</p>
                    {isLong && (
                        <button onClick={() => setOpen(o => !o)} className="text-[10px] font-bold text-blue-400 hover:text-blue-300 mt-0.5">
                            {open ? 'Show less ▴' : 'Read more ▾'}
                        </button>
                    )}
                </div>
            );
        };

        // --- SUBCOMPONENT: Data-driven moat assessment ---
        // SOIC-style deterministic financial analysis: Piotroski F-Score scorecard,
        // DuPont ROE breakdown, and a green/amber/red financial-health checklist.
        // Segment-wise business model: revenue + profit donuts and a per-segment table
        // with contribution bars, margin, YoY growth and an importance tag.
        const SegmentBreakdown = ({ segments, period, source }) => {
            const segs = (segments || []).filter(s => s && s.revenue_cr);
            if (segs.length < 2) return null;
            const palette = ['#2563eb', '#16a34a', '#d97706', '#db2777', '#0891b2', '#7c3aed', '#dc2626', '#0d9488'];
            const revData = segs.map(s => ({ label: s.name, value: s.revenue_cr }));
            const profData = segs.filter(s => s.profit_cr != null && s.profit_cr > 0).map(s => ({ label: s.name, value: s.profit_cr }));
            const hasProfit = segs.some(s => s.profit_pct != null);
            const impCls = (imp) => imp === 'Core' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/25'
                : imp === 'Major' ? 'text-blue-400 bg-blue-500/10 border-blue-500/25'
                : 'text-slate-400 bg-slate-800 border-slate-700';
            return (
                <div className="mb-6">
                    <div className="flex items-center gap-2 mb-2">
                        <h3 className="font-heading text-base font-bold text-slate-100 tracking-tight border-l-4 border-green-500 pl-3">Segment-wise Business Model</h3>
                        {period && <span className="text-[9px] font-bold uppercase tracking-wider text-slate-500 bg-slate-950 border border-slate-800 rounded px-2 py-0.5">{period}</span>}
                    </div>
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-4">
                        <div className={`grid grid-cols-1 ${profData.length ? 'md:grid-cols-2' : ''} gap-5`}>
                            <div>
                                <span className="text-[9px] text-blue-300 font-bold uppercase tracking-wider">Revenue Contribution</span>
                                <Donut data={revData} fmt={(v) => `₹${Number(v).toLocaleString('en-IN')}`} unit=" Cr" />
                            </div>
                            {profData.length > 0 && (
                                <div>
                                    <span className="text-[9px] text-emerald-300 font-bold uppercase tracking-wider">Profit Contribution</span>
                                    <Donut data={profData} fmt={(v) => `₹${Number(v).toLocaleString('en-IN')}`} unit=" Cr" />
                                </div>
                            )}
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-[11px]">
                                <thead><tr className="text-slate-600 uppercase tracking-wider text-[9px] text-left">
                                    <th className="py-1.5">Segment</th><th className="py-1.5">Revenue share</th>
                                    {hasProfit && <th className="py-1.5">Profit share</th>}
                                    {hasProfit && <th className="py-1.5 text-right">Margin</th>}
                                    <th className="py-1.5 text-right">YoY</th><th className="py-1.5 text-right">Role</th>
                                </tr></thead>
                                <tbody>
                                    {segs.map((s, i) => (
                                        <tr key={i} className="border-t border-slate-900">
                                            <td className="py-2 pr-2"><div className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-sm flex-shrink-0" style={{ background: palette[i % palette.length] }}></span><span className="text-slate-200 font-medium">{s.name}</span></div></td>
                                            <td className="py-2 pr-3 w-[24%]"><div className="flex items-center gap-2"><div className="flex-1 h-1.5 rounded bg-slate-800 overflow-hidden"><div className="h-full" style={{ width: `${s.pct}%`, background: palette[i % palette.length] }}></div></div><span className="text-slate-300 font-mono w-10 text-right">{s.pct}%</span></div></td>
                                            {hasProfit && <td className="py-2 pr-3 w-[20%]">{s.profit_pct != null ? <div className="flex items-center gap-2"><div className="flex-1 h-1.5 rounded bg-slate-800 overflow-hidden"><div className="h-full" style={{ width: `${Math.min(100, Math.max(0, s.profit_pct))}%`, background: '#16a34a' }}></div></div><span className="text-slate-300 font-mono w-10 text-right">{s.profit_pct}%</span></div> : <span className="text-slate-600">—</span>}</td>}
                                            {hasProfit && <td className="py-2 text-right font-mono text-slate-300">{s.margin != null ? `${s.margin}%` : '—'}</td>}
                                            <td className="py-2 text-right font-mono">{s.yoy_growth != null ? <span style={{ color: s.yoy_growth >= 0 ? '#16a34a' : '#dc2626' }}>{s.yoy_growth >= 0 ? '▲' : '▼'} {Math.abs(s.yoy_growth)}%</span> : <span className="text-slate-600">—</span>}</td>
                                            <td className="py-2 text-right"><span className={`text-[9px] font-bold uppercase px-1.5 py-0.5 rounded border ${impCls(s.importance)}`}>{s.importance || '—'}</span></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p className="text-[10px] text-slate-600 italic">Segment revenue &amp; profit from the company's audited BSE quarterly result filing. Contribution %, margin, YoY growth &amp; importance are computed.</p>
                    </div>
                </div>
            );
        };

        // Forward valuation: Current vs 1Y-Fwd vs 3Y-Fwd comparison table + PEG/CAGR chips.
        const ForwardValuation = ({ fv }) => {
            if (!fv || !fv.available) return <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg text-[11px] text-slate-500 italic">Forward valuation unavailable — projected financials could not be derived.</div>;
            const cr = (x) => x == null ? '—' : (Math.abs(x / 1e7) >= 1e5 ? `₹${(x / 1e7 / 1e5).toFixed(2)}L Cr` : `₹${Math.round(x / 1e7).toLocaleString('en-IN')} Cr`);
            const rs = (x) => x == null ? '—' : `₹${Number(x).toFixed(1)}`;
            const xx = (x) => x == null ? '—' : `${Number(x).toFixed(2)}x`;
            const pc = (x) => x == null ? '—' : `${(Number(x) * 100).toFixed(1)}%`;
            const pex = (x) => x == null ? '—' : `${Number(x).toFixed(1)}x`;
            const rows = [
                ['P/E', v => pex(v.pe)], ['EPS', v => rs(v.eps)], ['Revenue', v => cr(v.revenue)],
                ['Net Profit', v => cr(v.pat)], ['Net Margin', v => pc(v.net_margin)],
                ['EV / Sales', v => xx(v.ev_sales)], ['EV / EBITDA', v => xx(v.ev_ebitda)], ['M-Cap / Sales', v => xx(v.mcap_sales)],
            ];
            const chip = (label, val, tone) => (<div className={`px-3 py-1.5 rounded-md border text-center ${tone}`}><div className="text-sm font-bold">{val}</div><div className="text-[8px] uppercase tracking-wider opacity-70">{label}</div></div>);
            const pegTone = fv.peg == null ? 'bg-slate-900 border-slate-800 text-slate-400' : fv.peg < 1 ? 'bg-emerald-500/10 border-emerald-500/25 text-emerald-300' : fv.peg < 1.5 ? 'bg-amber-500/10 border-amber-500/25 text-amber-300' : 'bg-red-500/10 border-red-500/25 text-red-300';
            return (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                    <div className="flex flex-wrap gap-2">
                        {chip('Revenue CAGR', fv.revenue_cagr != null ? `${fv.revenue_cagr}%` : '—', 'bg-blue-500/10 border-blue-500/25 text-blue-300')}
                        {chip('Earnings CAGR', fv.earnings_cagr != null ? `${fv.earnings_cagr}%` : '—', 'bg-blue-500/10 border-blue-500/25 text-blue-300')}
                        {chip('PEG', fv.peg != null ? fv.peg : '—', pegTone)}
                        {fv.peg_tag && <div className="px-3 py-1.5 rounded-md border bg-slate-900 border-slate-800 flex items-center"><span className="text-[10px] text-slate-400">{fv.peg_tag}</span></div>}
                    </div>
                    <table className="w-full text-[11px]">
                        <thead>
                            <tr className="text-slate-500 uppercase tracking-wider text-[9px]">
                                <th className="text-left font-bold py-1.5">Metric</th>
                                <th className="text-right font-bold py-1.5">Current</th>
                                <th className="text-right font-bold py-1.5 text-blue-400">1Y Fwd</th>
                                <th className="text-right font-bold py-1.5 text-blue-400">3Y Fwd</th>
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map(([label, fmt], i) => (
                                <tr key={i} className="border-t border-slate-900">
                                    <td className="text-slate-300 font-medium py-1.5">{label}</td>
                                    <td className="text-right text-slate-400 font-mono">{fmt(fv.current)}</td>
                                    <td className="text-right text-slate-100 font-mono font-semibold">{fmt(fv.fwd_1y)}</td>
                                    <td className="text-right text-slate-100 font-mono font-semibold">{fmt(fv.fwd_3y)}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <p className="text-[10px] text-slate-600 italic">{fv.note}</p>
                </div>
            );
        };

        const FinancialAnalysis = ({ fa }) => {
            if (!fa || (!fa.piotroski && !fa.dupont && !fa.health)) {
                return <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg text-[11px] text-slate-500 italic">Financial analysis unavailable — statements could not be sourced for this company.</div>;
            }
            const pi = fa.piotroski, du = fa.dupont, h = fa.health;
            const dotColor = (s) => ({ green: '#16a34a', amber: '#d97706', red: '#dc2626', grey: '#475569' }[s] || '#475569');
            const bandColor = (b) => (b === 'Strong' || b === 'Good') ? 'text-emerald-400' : b === 'Average' ? 'text-amber-400' : b === 'Unavailable' ? 'text-slate-400' : 'text-red-400';
            return (
              <div className="space-y-3">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
                  {pi && (
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-[9px] text-blue-300 font-bold uppercase tracking-wider">Piotroski F-Score</span>
                        <span className={`text-[10px] font-bold uppercase tracking-wider ${bandColor(pi.band)}`}>{pi.band}</span>
                      </div>
                      <div className="flex items-baseline gap-2 mb-3">
                        <span className="text-3xl font-heading font-extrabold text-slate-100">{pi.score}</span>
                        <span className="text-sm text-slate-400">/ {pi.max}</span>
                        {pi.as_of && <span className="text-[10px] text-slate-500 ml-1">as of {pi.as_of}</span>}
                      </div>
                      <div className="flex flex-col gap-1">
                        {(pi.checks || []).map((c, i) => (
                          <div key={i} className="flex items-center gap-2 text-[11px]">
                            <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: c.na ? '#334155' : c.pass ? '#16a34a' : '#dc2626' }}></span>
                            <span className={c.na ? 'text-slate-600 line-through' : 'text-slate-300'}>{c.name}</span>
                            <span className="ml-auto text-slate-500 text-[10px] text-right truncate max-w-[45%]">{c.detail}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {du && du.latest && (
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg">
                      <span className="text-[9px] text-blue-300 font-bold uppercase tracking-wider">DuPont ROE Breakdown</span>
                      <div className="text-3xl font-heading font-extrabold text-slate-100 mt-1 mb-3">{du.latest.roe}%<span className="text-xs text-slate-400 font-normal"> ROE</span></div>
                      <div className="grid grid-cols-3 gap-2 mb-3">
                        {[['Net Margin', du.latest.net_margin + '%'], ['Asset Turns', du.latest.asset_turnover + 'x'], ['Leverage', du.latest.equity_multiplier + 'x']].map(([l, v], i) => (
                          <div key={i} className="p-2 bg-slate-900 border border-slate-800 rounded text-center">
                            <div className="text-sm font-bold text-slate-100">{v}</div>
                            <div className="text-[8px] text-slate-500 uppercase tracking-wider mt-0.5">{l}</div>
                          </div>
                        ))}
                      </div>
                      <div className="text-[11px] text-slate-400 leading-relaxed">ROE = margin × turnover × leverage. Driven mainly by <span className="text-blue-400 font-semibold">{du.primary_driver}</span>.</div>
                    </div>
                  )}
                </div>
                {h && h.rows && (
                  <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg">
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[9px] text-blue-300 font-bold uppercase tracking-wider">Financial Health Checklist</span>
                      <span className={`text-[10px] font-bold uppercase tracking-wider ${bandColor(h.grade)}`}>Quality: {h.grade}</span>
                    </div>
                    <div className="flex flex-col">
                      {h.rows.map((r, i) => (
                        <div key={i} className="flex items-center gap-2 py-1.5 border-b border-slate-900 last:border-0">
                          <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: dotColor(r.status) }}></span>
                          <span className="text-[11px] text-slate-200 font-medium flex-1">{r.question}</span>
                          <span className="text-[10px] text-slate-300 font-mono">{r.value}</span>
                          <span className="text-[10px] text-slate-500 w-44 text-right hidden md:block">{r.verdict}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
        };

        const MoatAssessment = ({ parsedJson }) => {
            const f20 = parsedJson?.['F-20'] || {};
            const strength = f20.moat_strength || 'Unrated';
            const confidence = f20.confidence_level || 80;
            const pillars = f20.pillars || [];
            const signals = f20.signals || [];
            const warnings = f20.warnings || [];
            const pros = f20.screener_pros || [];
            const cons = f20.screener_cons || [];
            const dataDriven = !!f20.method;
            const memoText = f20.memo_text || "The company retains a defensible market position supported by brand equity and customer transition stickiness.";

            // Colour by moat strength.
            const tone = strength === 'Wide' ? 'emerald'
                : strength === 'Narrow to Wide' ? 'blue'
                : strength === 'Narrow' ? 'amber'
                : strength === 'No moat' ? 'red' : 'slate';
            const toneText = { emerald:'text-emerald-400', blue:'text-blue-400', amber:'text-amber-400', red:'text-red-400', slate:'text-slate-400' }[tone];
            const toneBg = { emerald:'bg-emerald-500/10 border-emerald-500/25', blue:'bg-blue-500/10 border-blue-500/25', amber:'bg-amber-500/10 border-amber-500/25', red:'bg-red-500/10 border-red-500/25', slate:'bg-slate-800 border-slate-700' }[tone];
            // Raw hex for SVG (Tailwind's remapped palette doesn't reach inline SVG):
            // deepened accents that read on the light theme.
            const colorHex = { emerald: '#16a34a', blue: '#2563eb', amber: '#d97706', red: '#dc2626', slate: '#64748b' }[tone];

            const textToScan = [
                strength,
                memoText,
                ...signals,
                ...warnings,
                ...pros,
                ...cons
            ].join(' ').toLowerCase();

            const categories = [
                {
                    label: "Customer Experience",
                    desc: "Brand value, customer retention, trust",
                    keywords: ["brand", "consumer", "experience", "reputation", "trust", "franchise", "loyalty", "customer relationship", "customer satisfaction"]
                },
                {
                    label: "Service-Centric",
                    desc: "Client support & dealer network focus",
                    keywords: ["service", "support", "distribution network", "client", "customer support", "dealer", "touchpoint", "concessions"]
                },
                {
                    label: "Network-Effect",
                    desc: "Value grows with user base scale",
                    keywords: ["network", "scale", "platform", "ecosystem", "users", "network-effect", "connectivity", "marketplace"]
                },
                {
                    label: "Value-Based",
                    desc: "Cost advantage, premium value delivery",
                    keywords: ["cost", "low cost", "price", "value", "efficiency", "margin", "premium", "operating margin", "profitability", "cheap", "saving"]
                },
                {
                    label: "End to End",
                    desc: "Vertical integration & supply control",
                    keywords: ["vertical", "integration", "end-to-end", "supply chain", "manufacturing", "control", "integrated", "backward", "forward"]
                },
                {
                    label: "Wide Ecosystem",
                    desc: "Diverse product portfolio & reach",
                    keywords: ["ecosystem", "portfolio", "diversified", "segments", "wide", "omnichannel", "diverse", "cross-sell", "synergy"]
                },
                {
                    label: "Platform-Based",
                    desc: "Digital scale & tech ecosystem leverage",
                    keywords: ["platform", "digital", "app", "software", "online", "technology", "e-commerce", "tech stack"]
                },
                {
                    label: "Solution-Centric",
                    desc: "Customized client problem solving",
                    keywords: ["solution", "solving", "needs", "customized", "integrated service", "consultative"]
                }
            ];

            // Only the moat types actually detected for THIS company (from its own
            // signals, memo and Screener flags) — no fixed template wheel.
            const detected = categories.filter(cat => cat.keywords.some(kw => textToScan.includes(kw)));

            // SVG layout values
            const cx = 250;
            const cy = 160;
            const rInner = 48;
            const rOuter = 62;
            const rSpoke = 118;

            const spokes = detected.map((cat, i) => {
                const angle = -90 + (i * 360) / detected.length;
                const angleRad = (angle * Math.PI) / 180;
                const cos = Math.cos(angleRad), sin = Math.sin(angleRad);
                return {
                    ...cat, active: true, angle, cos, sin,
                    sx: cx + rOuter * cos, sy: cy + rOuter * sin,
                    tx: cx + rSpoke * cos, ty: cy + rSpoke * sin,
                };
            });

            const hasDetail = signals.length > 0 || warnings.length > 0 || pros.length > 0 || cons.length > 0 || memoText || pillars.length > 0;

            return (
                <div className="p-5 bg-slate-950 border border-slate-800 rounded-lg space-y-4 font-sans">
                    {/* Header: moat strength label + confidence + data-driven badge */}
                    <div className="flex items-center justify-between gap-3 flex-wrap">
                        <div className="flex items-center gap-3">
                            <span className={`text-lg font-heading font-extrabold uppercase tracking-wider ${toneText}`}>
                                {strength}{strength !== 'No moat' && strength !== 'Unrated' ? ' Moat' : ''}
                            </span>
                            <span className={`text-[10px] font-bold border rounded-md px-2 py-1 ${toneBg} ${toneText}`}>
                                Confidence {confidence}%
                            </span>
                        </div>
                        {dataDriven && <span className="text-[8px] font-bold uppercase tracking-wider text-emerald-300 bg-emerald-500/10 border border-emerald-500/25 px-2 py-1 rounded-md whitespace-nowrap">● Data-driven</span>}
                    </div>

                    {/* Interactive Moat Wheel Infographic — only this company's detected moats */}
                    <div className="flex flex-col items-center justify-center p-2 bg-slate-900/50 rounded-lg border border-slate-800/40 relative overflow-hidden">
                        <span className="absolute top-2 left-3 text-[9px] text-slate-500 uppercase font-bold tracking-wider">Moat Profile</span>
                        {spokes.length === 0 ? (
                            <p className="text-[11px] text-slate-500 italic py-10 px-4 text-center">No distinct moat source could be detected from this company's fundamentals, filings and signals.</p>
                        ) : (
                        <svg viewBox="0 0 500 320" className="w-full max-w-[520px] h-auto">
                            {/* Outer boundary ring */}
                            <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke="#e2e8f0" strokeWidth="1" strokeDasharray="3 3" />

                            {/* Spokes */}
                            {spokes.map((sp, i) => (
                                <g key={i} className="transition-all duration-300">
                                    {/* Spoke line */}
                                    <line
                                        x1={sp.sx} y1={sp.sy} x2={sp.tx} y2={sp.ty}
                                        stroke={sp.active ? colorHex : "#cbd5e1"}
                                        strokeWidth={sp.active ? "2.5" : "1"}
                                        className="transition-all duration-300"
                                        strokeDasharray={sp.active ? "" : "2 2"}
                                    />
                                    {/* Spoke terminal dot */}
                                    <circle
                                        cx={sp.tx} cy={sp.ty} r={sp.active ? "5.5" : "4"}
                                        fill={sp.active ? colorHex : "#ffffff"}
                                        stroke={sp.active ? "none" : "#cbd5e1"}
                                        strokeWidth="1.5"
                                        className="transition-all duration-300"
                                        filter={sp.active ? "drop-shadow(0px 0px 4px " + colorHex + ")" : ""}
                                    />
                                    {/* Label text */}
                                    <text
                                        x={sp.tx}
                                        y={sp.ty}
                                        fill="#0f172a"
                                        fontSize="10"
                                        fontWeight="bold"
                                        textAnchor={sp.cos > 0.35 ? "start" : sp.cos < -0.35 ? "end" : "middle"}
                                        dominantBaseline="middle"
                                        dx={sp.cos > 0.35 ? 10 : sp.cos < -0.35 ? -10 : 0}
                                        dy={sp.sin < -0.35 ? -12 : sp.sin > 0.35 ? 16 : 0}
                                        className="select-none font-sans font-medium"
                                    >
                                        {sp.label}
                                    </text>
                                </g>
                            ))}

                            {/* Inner concentric ring */}
                            <circle cx={cx} cy={cy} r={rInner} fill="#ffffff" stroke={colorHex} strokeWidth="2.5" />
                            {/* Inner central text */}
                            <text x={cx} y={cy - 4} fill="#64748b" fontSize="8" fontWeight="bold" textAnchor="middle" letterSpacing="0.05em">MOAT</text>
                            <text x={cx} y={cy + 9} fill={colorHex} fontSize="12" fontWeight="bold" textAnchor="middle" className="uppercase tracking-wider">
                                {strength === 'Unrated' || strength === 'No moat' ? 'None' : strength.split(' ')[0]}
                            </text>
                        </svg>
                        )}
                        {spokes.length > 0 && (
                            <p className="pb-1 text-[9px] text-slate-500 font-semibold text-center">
                                {spokes.length} moat source{spokes.length > 1 ? 's' : ''} detected for this company — derived from its own signals, filings &amp; fundamentals (not a fixed template).
                            </p>
                        )}
                    </div>

                    {/* Single collapsible section with ALL moat detail */}
                    {hasDetail && (
                        <Expandable title="Moat Details — Strengths, Risks, Narrative & Methodology" defaultOpen={false}>
                            <div className="space-y-4">
                                {/* Moat Strengths & Risks side by side */}
                                {(signals.length > 0 || warnings.length > 0) && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {signals.length > 0 && (
                                            <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                                <span className="text-[10px] text-slate-100 font-bold uppercase tracking-wider block mb-2 flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500"></span>Moat Strengths</span>
                                                <ul className="space-y-1.5">
                                                    {signals.map((s, i) => <li key={i} className="text-[11px] text-slate-200 leading-snug flex gap-2"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mt-1.5 flex-shrink-0"></span><span>{s}</span></li>)}
                                                </ul>
                                            </div>
                                        )}
                                        {warnings.length > 0 && (
                                            <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                                <span className="text-[10px] text-slate-100 font-bold uppercase tracking-wider block mb-2 flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-500"></span>Moat Risks</span>
                                                <ul className="space-y-1.5">
                                                    {warnings.map((s, i) => <li key={i} className="text-[11px] text-slate-200 leading-snug flex gap-2"><span className="w-1.5 h-1.5 rounded-full bg-red-500 mt-1.5 flex-shrink-0"></span><span>{s}</span></li>)}
                                                </ul>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Supporting flags from Screener.in */}
                                {(pros.length > 0 || cons.length > 0) && (
                                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                        <span className="text-[9px] text-slate-500 font-bold uppercase tracking-wider block mb-1.5">Supporting flags · per Screener.in</span>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1">
                                            {pros.map((p, i) => <div key={'p'+i} className="text-[10px] text-slate-400 flex gap-1.5"><span className="text-emerald-500">+</span><span>{p}</span></div>)}
                                            {cons.map((c, i) => <div key={'c'+i} className="text-[10px] text-slate-400 flex gap-1.5"><span className="text-red-500">–</span><span>{c}</span></div>)}
                                        </div>
                                    </div>
                                )}

                                {/* Moat Narrative Memo */}
                                <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                    <span className="text-[9px] text-slate-500 font-bold uppercase tracking-wider block mb-1">Moat Narrative Memo</span>
                                    <p className="text-xs text-slate-350 leading-relaxed">{memoText}</p>
                                </div>

                                {/* How this moat score is calculated */}
                                {pillars.length > 0 && (
                                    <div className="p-3 bg-slate-900 border border-slate-800 rounded-lg">
                                        <span className="text-[9px] text-slate-500 font-bold uppercase tracking-wider block mb-1.5">How is this moat assessed?</span>
                                        <div className="space-y-2 text-[11px] text-slate-400 leading-relaxed">
                                            <p>Assessment built from these aspects of the company's real multi-year fundamentals (from Screener.in):</p>
                                            <ul className="space-y-1 pl-1">
                                                {pillars.map((p, i) => (
                                                    <li key={i}>• <span className="text-slate-300 font-semibold">{p.label}</span> — {p.basis}</li>
                                                ))}
                                            </ul>
                                            <p className="text-slate-500">Bands: <span className="text-emerald-400 font-semibold">Wide ≥ 70</span> · <span className="text-blue-400 font-semibold">Narrow-to-Wide 50–69</span> · <span className="text-amber-400 font-semibold">Narrow 30–49</span> · <span className="text-red-400 font-semibold">No moat &lt; 30</span>. {f20.is_financial ? 'This is a lender, so it uses the ROE-led branch.' : ''} <span className="text-slate-400 font-semibold">Confidence = data coverage</span> (how many aspects had real data).</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </Expandable>
                    )}
                </div>
            );
        };


        // Visual concall render: tone gauge + colour-coded driver/risk/win groups +
        // guidance strip + KPI chips. Turns the F-14 prose into a scannable board.
        const ConcallVisual = ({ f14 }) => {
            if (!f14) return null;
            // Coerce ANY LLM shape (array / string / object / null) into a clean string
            // list — the fallback model sometimes returns a field as a bare string or an
            // object, which would otherwise crash .filter/.map and blank the whole app.
            const toList = (v) => {
                const norm = (x) => {
                    if (x == null || x === '') return null;
                    if (typeof x === 'string') return x;
                    if (typeof x === 'object') return Object.values(x).filter(Boolean).map(String).join(' — ') || null;
                    return String(x);
                };
                if (Array.isArray(v)) return v.map(norm).filter(Boolean);
                const s = norm(v);
                return s ? [s] : [];
            };
            const asText = (v) => (v == null ? '' : typeof v === 'string' ? v : typeof v === 'object' ? Object.values(v).filter(Boolean).map(String).join(' — ') : String(v));
            const tone = asText(f14.tone).toLowerCase();
            const toneColor = tone.includes('posit') ? { t: 'text-emerald-400', b: 'bg-emerald-500/10 border-emerald-500/30' }
                : tone.includes('negat') ? { t: 'text-red-400', b: 'bg-red-500/10 border-red-500/30' }
                : { t: 'text-amber-400', b: 'bg-amber-500/10 border-amber-500/30' };
            const highlights = toList(f14.financial_highlights);
            const Group = ({ title, items, accent }) => {
                const list = toList(items);
                if (!list.length) return null;
                return (
                    <div className="bg-slate-900 border border-slate-800 rounded-lg p-3">
                        <div className="flex items-center gap-2 mb-2">
                            <span className="w-1 h-3.5 rounded-sm" style={{ background: accent }}></span>
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-300">{title}</span>
                            <span className="text-[9px] text-slate-600 ml-auto">{list.length}</span>
                        </div>
                        <div className="flex flex-col gap-1.5">
                            {list.map((x, i) => (
                                <div key={i} className="flex items-start gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style={{ background: accent }}></span>
                                    <span className="text-[11px] text-slate-300 leading-snug">{x}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            };
            return (
                <div className="space-y-3">
                    {/* tone + one-line summary */}
                    <div className="flex items-start gap-3 flex-wrap">
                        {f14.tone && <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md border ${toneColor.b} ${toneColor.t}`}>{asText(f14.tone)} tone</span>}
                        {f14.summary && <p className="text-[11px] text-slate-400 leading-snug flex-1 min-w-[200px]">{asText(f14.summary)}</p>}
                    </div>
                    {/* KPI chips */}
                    {highlights.length > 0 && (
                        <div className="flex flex-wrap gap-1.5">
                            {highlights.map((h, i) => (
                                <span key={i} className="text-[11px] font-medium text-slate-200 bg-slate-900 border border-slate-800 rounded-md px-2 py-1">{h}</span>
                            ))}
                        </div>
                    )}
                    {/* colour-coded groups */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        <Group title="Growth Drivers" items={f14.growth_drivers} accent="#16a34a" />
                        <Group title="Business Wins" items={f14.business_wins} accent="#2563eb" />
                        <Group title="Risks" items={f14.risks} accent="#dc2626" />
                        <Group title="What Matters" items={f14.what_matters} accent="#7c3aed" />
                    </div>
                    {/* guidance strip */}
                    {asText(f14.guidance) && asText(f14.guidance) !== '—' && (
                        <div className="flex items-start gap-2 bg-amber-500/5 border border-amber-500/20 rounded-lg px-3 py-2">
                            <span className="text-[9px] font-bold uppercase tracking-wider text-amber-500 mt-0.5 flex-shrink-0">Guidance</span>
                            <span className="text-[11px] text-slate-300 leading-snug">{asText(f14.guidance)}</span>
                        </div>
                    )}
                </div>
            );
        };

        // Inventory Turnover (async, after core report): the REAL standalone figure,
        // computed from the company's OWN audited NSE XBRL filings. Shows the ratio +
        // every number behind it (COGS a+b+c, the two year-end inventories) + source.
        // Lenders (no inventory) render a clean N/A, never a fabricated number.
        // Small "ⓘ" info button — click to reveal a plain-English explainer, so the
        // main view can stay just the number without losing the definition.
        const InfoTip = ({ text }) => {
            const [open, setOpen] = React.useState(false);
            return (
                <span className="relative inline-block">
                    <button type="button" onClick={() => setOpen(o => !o)}
                        className="w-4 h-4 rounded-full border border-slate-600 text-slate-400 hover:text-blue-300 hover:border-blue-400 text-[10px] font-bold flex items-center justify-center leading-none transition">
                        i
                    </button>
                    {open && (
                        <div className="absolute z-20 left-0 top-5 w-64 p-3 bg-slate-900 border border-slate-700 rounded-lg shadow-xl text-[10px] text-slate-300 leading-relaxed">
                            {text}
                        </div>
                    )}
                </span>
            );
        };

        // Renders one "Source ↗" link per statement page a ratio drew from
        // (P&L / Balance Sheet), each pointing DIRECTLY at that page via the
        // PDF's #page=N fragment — clicking opens the Annual Report already
        // scrolled to the exact page the number came from, not page 1.
        const SourceLinks = ({ sources }) => {
            const list = sources || [];
            if (list.length === 0) return null;
            // Always label by statement type (P&L / Balance Sheet) — never a
            // generic "Source" — so the link text is consistent everywhere,
            // whether a ratio cites one page or two.
            return (
                <>
                    {list.map((s, i) => (
                        <a key={i} href={s.url} target="_blank" rel="noopener noreferrer"
                            className="text-[10px] font-bold text-blue-400 hover:text-blue-300 whitespace-nowrap">
                            {s.label || 'Source'} ↗
                        </a>
                    ))}
                </>
            );
        };

        // Colour-codes a ratio's headline number so a reader can tell good/bad
        // at a glance without reading the tooltip: green = healthy per the
        // spec's own benchmark range, red = the spec's own warning threshold,
        // and the default light text otherwise (neither clearly good nor bad —
        // NOT amber, amber is reserved for "Estimated"/proxy badges elsewhere).
        // `toneOf(value, {good, bad, higherIsBetter})` — `good`/`bad` are each
        // either a number (a one-sided threshold) or [min, max] (a healthy
        // band); `higherIsBetter` picks which side of a one-sided threshold
        // counts as good vs bad.
        const toneOf = (value, { good, bad, higherIsBetter = true } = {}) => {
            if (value == null || isNaN(value)) return 'mid';
            const inBand = (b) => Array.isArray(b) ? (value >= b[0] && value <= b[1])
                : (higherIsBetter ? value >= b : value <= b);
            if (bad != null) {
                const inBadBand = Array.isArray(bad) ? (value >= bad[0] && value <= bad[1])
                    : (higherIsBetter ? value <= bad : value >= bad);
                if (inBadBand) return 'bad';
            }
            if (good != null && inBand(good)) return 'good';
            return 'mid';
        };
        // NOTE: an earlier version added a dark text-stroke/shadow here for a
        // subtle "outline" effect, but it visibly distorted bold numeric
        // glyphs (4, 6, 9 rendered with a doubled/merged stroke) — removed
        // entirely per user feedback; colour alone conveys tone.
        const TONE_STYLE = {};
        const TONE_CLASS = { good: 'text-emerald-400', mid: 'text-slate-100', bad: 'text-red-400' };
        const ToneValue = ({ value, tone, unit, suffix }) => (
            <div className={`font-heading text-3xl font-extrabold ${TONE_CLASS[tone] || TONE_CLASS.mid}`} style={TONE_STYLE}>
                {value}{unit && <span className="text-lg text-slate-400 ml-0.5" style={{ textShadow: 'none' }}>{unit}</span>}
                {suffix}
            </div>
        );

        const InventoryTurnover = ({ symbol, name }) => {
            const [state, setState] = React.useState({ loading: true });
            const [period, setPeriod] = React.useState(null); // to_date; null = latest
            const [showCalc, setShowCalc] = React.useState(false); // "how we calculated this" — collapsed by default
            const [pickerOpen, setPickerOpen] = React.useState(false); // small year dropdown next to the period badge
            React.useEffect(() => { setPeriod(null); setPickerOpen(false); }, [symbol]);
            React.useEffect(() => {
                let cancelled = false;
                setState(s => ({ ...s, loading: true })); // keep prior data so the badge stays put while the new year loads
                const token = localStorage.getItem(TOKEN_KEY);
                fetch(`${API_BASE}/api/v1/inventory-turnover`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ symbol, name, to_date: period }),
                }).then(r => r.json()).then(d => { if (!cancelled) setState({ loading: false, data: d }); })
                  .catch(() => { if (!cancelled) setState({ loading: false, data: { applicable: false, reason: 'Network error.' } }); });
                return () => { cancelled = true; };
            }, [symbol, period]);

            const cr = (v) => (v == null || isNaN(v)) ? '—'
                : `₹${Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} Cr`;

            if (state.loading && !state.data) return (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg animate-pulse">
                    <div className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Inventory Turnover</div>
                    <div className="text-slate-600 text-xs mt-2">Reading audited filings…</div>
                </div>
            );
            const d = state.data || {};
            // Newest FY first — the server already picks the latest year by default
            // (to_date=null); this just guarantees dropdown order matches.
            const periods = [...(d.available_periods || [])].sort((a, b) => (a.to_date < b.to_date ? 1 : -1));
            const sel = d.selected_period || period;

            // Period badge + small dropdown arrow (replaces the old separate year
            // row): click the badge to pick a different FY, latest is shown by default.
            const PeriodPicker = (
                <div className="relative flex-shrink-0">
                    <button onClick={() => setPickerOpen(o => !o)} disabled={periods.length === 0}
                        className="flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider text-blue-300 bg-blue-500/10 border border-blue-500/25 px-2 py-1 rounded-md whitespace-nowrap disabled:cursor-default">
                        {d.period || 'Consolidated'}
                        {periods.length > 0 && <span className="text-[10px]">{pickerOpen ? '▴' : '▾'}</span>}
                    </button>
                    {pickerOpen && periods.length > 0 && (
                        <div className="absolute right-0 top-full mt-1 z-20 bg-slate-900 border border-slate-700 rounded-lg shadow-xl py-1 min-w-[80px]">
                            {periods.map(p => (
                                <button key={p.to_date} onClick={() => { setPeriod(p.to_date); setPickerOpen(false); }}
                                    className={`block w-full text-left text-[11px] font-bold px-3 py-1.5 whitespace-nowrap ${sel === p.to_date ? 'text-blue-300 bg-blue-500/10' : 'text-slate-300 hover:bg-slate-800'}`}>
                                    {p.label}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );

            if (!d.applicable) return (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg">
                    <div className="flex items-center justify-between gap-2">
                        <div className="font-heading text-2xl font-extrabold text-slate-500">—</div>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 bg-slate-900 border border-slate-800 px-2 py-0.5 rounded">N/A</span>
                            {PeriodPicker}
                        </div>
                    </div>
                    <div className="text-[10px] text-slate-500 mt-1.5 leading-snug">{d.reason || 'Not applicable for this company.'}</div>
                </div>
            );

            const num = d.numerator || {}, den = d.denominator || {};
            const comps = num.components || {};
            const invByYr = den.inventory_by_year || {};
            const sources = d.sources || [];
            const Row = ({ label, val, strong, indent }) => (
                <div className={`flex items-baseline justify-between gap-3 ${indent ? 'pl-3' : ''}`}>
                    <span className={`text-[11px] leading-snug ${strong ? 'text-slate-200 font-semibold' : 'text-slate-400'}`}>{label}</span>
                    <span className={`text-[11px] font-mono whitespace-nowrap ${strong ? 'text-slate-100 font-bold' : 'text-slate-300'}`}>{val}</span>
                </div>
            );

            return (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                    <div className="flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Inventory Turnover</span>
                            <InfoTip text="Measures how efficiently inventory is converted into sales — a key working-capital signal. Formula: Cost of Goods Sold ÷ Average Inventory. Can be distorted by understating COGS or by stale/obsolete stock inflating average inventory. Indicative benchmark: Manufacturing/FMCG 6-12x is healthy, below 3x suggests slow-moving stock (varies by industry)." />
                        </div>
                        <div className="flex items-center gap-1.5 flex-shrink-0">
                            {d.estimated && <span className="text-[10px] font-bold uppercase tracking-wider text-amber-200 bg-amber-950 border border-amber-500/60 px-2 py-1 rounded-md whitespace-nowrap">Estimated</span>}
                            {PeriodPicker}
                        </div>
                    </div>
                    <div className="flex items-baseline gap-2">
                        <ToneValue value={d.value} unit={d.unit || 'x'} tone={toneOf(d.value, { good: 6, bad: 3 })} />
                        {d.confidence != null && (
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded border whitespace-nowrap ${d.confidence >= 1 ? 'text-emerald-200 bg-emerald-950 border-emerald-500/60' : d.confidence >= 0.9 ? 'text-blue-200 bg-blue-950 border-blue-500/60' : 'text-amber-200 bg-amber-950 border-amber-500/60'}`}
                                title="Confidence: 1.0 = read directly from the financial statements; 0.95 = prior-year from a separate filing; 0.8 = estimated (opening inventory unavailable).">
                                Confidence {d.confidence.toFixed(2)}
                            </span>
                        )}
                    </div>

                    <button onClick={() => setShowCalc(s => !s)}
                        className="text-[10px] font-bold text-blue-400 hover:text-blue-300 flex items-center gap-1">
                        {showCalc ? 'Hide calculation ▴' : 'How we calculated this ▾'}
                    </button>

                    {showCalc && (<>
                        <div className="pt-2 border-t border-slate-800/70 space-y-1">
                            <Row label={num.label || 'Cost of Goods Sold (a + b + c)'} val={cr(num.value_cr)} strong />
                            {Object.entries(comps).map(([k, v], i) => (
                                <Row key={i} label={`${String.fromCharCode(97 + i)}) ${k}`} val={cr(v)} indent />
                            ))}
                        </div>
                        <div className="pt-2 border-t border-slate-800/70 space-y-1">
                            <Row label={den.label || 'Average Inventory'} val={cr(den.value_cr)} strong />
                            {Object.entries(invByYr).map(([yr, v], i) => (
                                <Row key={i} label={`Inventory ${yr}`} val={cr(v)} indent />
                            ))}
                        </div>
                        <div className="flex items-center justify-between gap-2 pt-1">
                            <span className="text-[10px] text-slate-600 italic leading-snug">{d.note || 'Consolidated, audited — from NSE XBRL filings.'}</span>
                            <SourceLinks sources={sources} />
                        </div>
                    </>)}
                </div>
            );
        };

        // Gross Profit Margin = (Revenue − COGS) ÷ Revenue. Ind AS Schedule III
        // has no explicit "Gross Profit" line, so this is always reconstructed
        // from the SAME COGS (a+b+c) components validated for Inventory
        // Turnover (Sr No 1) — never taken from a pre-computed Screener figure
        // without checking how it was derived. Mirrors InventoryTurnover's
        // structure/UX, but the headline stays NEUTRAL (no green/red) since
        // the healthy range is highly industry-dependent (FMCG/Pharma 40-60%+
        // vs Trading 10-20%) — a fixed threshold here would mislead.
        const GrossProfitMargin = ({ symbol, name }) => {
            const [state, setState] = React.useState({ loading: true });
            const [period, setPeriod] = React.useState(null);
            const [showCalc, setShowCalc] = React.useState(false);
            const [pickerOpen, setPickerOpen] = React.useState(false);
            React.useEffect(() => { setPeriod(null); setPickerOpen(false); }, [symbol]);
            React.useEffect(() => {
                let cancelled = false;
                setState(s => ({ ...s, loading: true }));
                const token = localStorage.getItem(TOKEN_KEY);
                fetch(`${API_BASE}/api/v1/gross-profit-margin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ symbol, name, to_date: period }),
                }).then(r => r.json()).then(d => { if (!cancelled) setState({ loading: false, data: d }); })

                            <div className="flex items-center justify-between gap-2">
