<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navrist Research Terminal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563EB'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='18' fill='white'>N</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Arial', 'Helvetica', 'sans-serif'],
                        heading: ['Arial', 'Helvetica', 'sans-serif'],
                    },
                    colors: {
                        /*
                         * LIGHT PROFESSIONAL THEME.
                         * The whole UI was authored against a dark slate scale (dark bg,
                         * light text). Rather than rewrite ~200 utility classes, the slate
                         * scale is remapped here so the SAME classes render a clean light
                         * theme: high keys (900/950 = backgrounds) -> white/near-white,
                         * mid keys (700/800 = borders) -> light gray, low keys
                         * (100-400 = text) -> dark navy/slate. Accents are deepened so they
                         * read on white. Single source of truth — palette only.
                         */
                        slate: {
                            50:  '#f8fafc',
                            100: '#0f172a',  /* strong heading text -> navy */
                            200: '#1e293b',  /* heading text */
                            300: '#334155',  /* body text */
                            350: '#475569',
                            400: '#475569',  /* muted text (readable on white) */
                            450: '#64748b',
                            500: '#64748b',  /* muted labels */
                            505: '#64748b',
                            550: '#94a3b8',  /* faint labels */
                            555: '#94a3b8',
                            600: '#94a3b8',  /* faint text */
                            700: '#cbd5e1',  /* light border */
                            800: '#e2e8f0',  /* standard border / dividers */
                            850: '#eef2f7',  /* hover / active surface */
                            855: '#eef2f7',
                            900: '#ffffff',  /* card background */
                            950: '#f8fafc',  /* page / inset background */
                            955: '#f1f5f9',  /* table header background */
                        },
                        blue: {
                            200: '#1d4ed8',  /* readable on light highlight rows */
                            300: '#1d4ed8',
                            400: '#2563eb',
                            500: '#2563eb',
                            550: '#2563eb',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            950: '#eff6ff',  /* light tint for highlighted rows */
                        },
                        emerald: {
                            400: '#16a34a',
                            500: '#16a34a',
                        },
                        green: {
                            400: '#16a34a',
                            500: '#16a34a',
                        },
                        red: {
                            200: '#991b1b',
                            300: '#b91c1c',
                            400: '#dc2626',  /* loss / down / fail */
                            500: '#dc2626',
                            900: '#fecaca',  /* light error border */
                            950: '#fef2f2',  /* light error background */
                        },
                        amber: {
                            400: '#b45309',
                            500: '#d97706',
                        },
                        teal: {
                            400: '#0d9488',
                            500: '#0d9488',
                        },
                        /* Navrist institutional accent */
                        brand: {
                            DEFAULT: '#2563eb',
                            light: '#3b82f6',
                            dark: '#1d4ed8',
                        },
                    },
                }
            }
        }
    </script>
    <!-- Custom CSS style overrides -->
    <style>
        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background-color: #f8fafc;
            background-image:
                radial-gradient(900px circle at 50% -160px, rgba(37, 99, 235, 0.06), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #334155; /* slate body text */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .font-heading {
            font-family: 'Arial', 'Helvetica', sans-serif;
            letter-spacing: -0.01em;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ---------- Premium polish ---------- */
        @keyframes nvFade {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }
        /* Tab panels fade/slide in on switch + soft elevation */
        main > section, main > div {
            animation: nvFade .30s cubic-bezier(.22,.61,.36,1) both;
        }
        main > section {
            box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 14px 36px -20px rgba(15,23,42,.22);
        }
        /* Reusable elevation for the header + tab bar */
        .nv-elevate {
            box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 10px 28px -18px rgba(15,23,42,.18);
        }
        /* Dropdown / popover that must clearly float above the page */
        .nv-float {
            box-shadow: 0 16px 40px -10px rgba(15,23,42,.28), 0 4px 10px rgba(15,23,42,.10);
        }
        /* Smooth transitions on the top tab pills */
        .nv-tabbar button {
            transition: transform .15s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease;
        }
        .nv-tabbar button:hover { transform: translateY(-1px); }
        /* Opt-in hover-lift for clickable stat tiles */
        .nv-tile {
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
        }
        .nv-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -12px rgba(15,23,42,.22);
            border-color: #cbd5e1;
        }
        @media (prefers-reduced-motion: reduce) {
            main > section, main > div { animation: none; }
            .nv-tabbar button:hover, .nv-tile:hover { transform: none; }
        }

        /* Business Model Canvas — Strategyzer 9-box layout.
           Rows are content-sized (no fixed heights): cells in the same row always
           match heights via grid stretch, and nothing clips or scrolls. */
        .bmc-grid {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr;
            grid-template-areas:
                "kp" "ka" "kr" "vp" "cr" "ch" "cs";
        }
        @media (min-width: 768px) {
            .bmc-grid {
                /* minmax(0,1fr): keep columns truly equal regardless of content */
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-areas:
                    "kp ka"
                    "kr vp"
                    "cr ch"
                    "cs cs";
            }
        }
        @media (min-width: 1024px) {
            .bmc-grid {
                grid-template-columns: repeat(10, minmax(0, 1fr));
                grid-template-areas:
                    "kp kp ka ka vp vp cr cr cs cs"
                    "kp kp kr kr vp vp ch ch cs cs";
            }
        }
        /* Thin scrollbar for canvas / revenue / cost blocks that hold long lists,
           so every point stays reachable without stretching the layout. */
        .bmc-scroll { scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .bmc-scroll::-webkit-scrollbar { width: 6px; }
        .bmc-scroll::-webkit-scrollbar-track { background: transparent; }
        .bmc-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
    <!-- Stable Production React & Babel CDNs from cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-transparent text-[#334155] relative selection:bg-blue-500/20 selection:text-blue-900">
    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.getElementById('root').innerHTML = '<div style="color:red;padding:40px;font-size:14px;font-family:monospace;white-space:pre-wrap"><h2>JavaScript Error</h2>' + msg + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\n\n' + (error ? error.stack : '') + '</div>';
            console.error('CAUGHT ERROR:', msg, 'at line', lineNo, 'col', columnNo, error);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('root').innerHTML = '<div style="color:orange;padding:40px;font-size:14px;font-family:monospace;white-space:pre-wrap"><h2>Unhandled Promise Rejection</h2>' + event.reason + '</div>';
        });
    </script>

    <script type="text/babel">
        console.log("[React App] Mounting single-page dashboard...");
        const { useState, useEffect, useRef } = React;

        // Backend API base.
        // When this page is served by the FastAPI backend (production / Indian-cloud
        // deploy), the API lives on the SAME origin, so we use relative URLs and the
        // app works behind any domain with no code change. When opened from a
        // separate static dev server (e.g. http.server on :5500) or file://, we fall
        // back to the local FastAPI port.
        const API_BASE = (function () {
            const origin = window.location.origin || '';
            const isStandaloneDev = origin.includes(':5500') || origin.startsWith('file');
            if (origin.startsWith('http') && !isStandaloneDev) return origin;
            return 'http://127.0.0.1:8000';
        })();
        const TOKEN_KEY = 'navrist_token';

        // Animated count-up for headline numbers (quality score, etc.).
        const CountUp = ({ value, decimals = 0, suffix = '', className }) => {
            const [display, setDisplay] = useState(0);
            useEffect(() => {
                const to = Number(value);
                if (isNaN(to)) { setDisplay(0); return; }
                let raf;
                const dur = 900, start = performance.now();
                const tick = (t) => {
                    const p = Math.min(1, (t - start) / dur);
                    const eased = 1 - Math.pow(1 - p, 3);
                    setDisplay(to * eased);
                    if (p < 1) raf = requestAnimationFrame(tick);
                };
                raf = requestAnimationFrame(tick);
                return () => cancelAnimationFrame(raf);
            }, [value]);
            return <span className={className}>{display.toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })}{suffix}</span>;
        };

        // Searchable index of everything in the dashboard. Each entry maps search
        // terms -> the section tab + sub-tab to open, a breadcrumb path, and an
        // optional `find` string to scroll the exact element into view.
        const SEARCH_INDEX = [
            { label: "Financial statements", kw: "financial statements income statement balance sheet cash flow line item 5y 12q annual quarterly", loc: "Statements & Growth", tab: 1, sub: 0 },
            { label: "Income statement", kw: "income statement profit loss p&l", loc: "Financial statements analysis", tab: 1, sub: 0, find: "Line Item" },
            { label: "Balance sheet", kw: "balance sheet assets liabilities equity", loc: "Financial statements analysis", tab: 1, sub: 0, find: "Line Item" },
            { label: "Cash flow statement", kw: "cash flow statement cfo financing investing", loc: "Financial statements analysis", tab: 1, sub: 0, find: "Line Item" },
            { label: "Revenue & Net Profit trend", kw: "revenue net profit pat trend chart key movement", loc: "Financial statements analysis", tab: 1, sub: 0, find: "Revenue & Net Profit Trend" },
            { label: "Revenue growth (YoY / QoQ)", kw: "growth yoy qoq revenue trend acceleration", loc: "Revenue/profit trend analysis", tab: 1, sub: 1, find: "Revenue Growth Trend" },
            { label: "CAGR & growth acceleration", kw: "cagr 3y growth acceleration velocity", loc: "Revenue/profit trend analysis", tab: 1, sub: 1, find: "Growth CAGRs" },
            { label: "Margin analysis", kw: "margin gross ebitda ebit pat improving deteriorating", loc: "Statements & Growth", tab: 1, sub: 2, find: "Margin Analysis" },
            { label: "Result snapshot", kw: "quarterly results result snapshot latest quarter", loc: "Quarterly results analysis", tab: 1, sub: 3, find: "Result Snapshot" },
            { label: "Beat / Miss summary", kw: "beat miss pead summary surprise", loc: "Quarterly results analysis", tab: 1, sub: 3, find: "Beat / Miss" },
            { label: "KPI Movement table", kw: "kpi movement qoq yoy quarter", loc: "Quarterly results analysis", tab: 1, sub: 3, find: "KPI Movement" },
            { label: "Quarter end / PAT / Revenue", kw: "quarter end pat revenue operating margin recent quarters", loc: "Quarterly results analysis", tab: 1, sub: 3, find: "Recent Quarters" },
            { label: "Ratio dashboard", kw: "ratio dashboard operating margin debt equity asset turns", loc: "Ratio analysis", tab: 2, sub: 0, find: "Return-Ratio Trend" },
            { label: "ROE / ROCE", kw: "roe roce return on equity capital employed", loc: "Ratio analysis", tab: 2, sub: 0, find: "Return-Ratio Trend" },
            { label: "ROE / ROCE", kw: "roe roce return ratio chart quality commentary dupont", loc: "ROE/ROCE analysis", tab: 2, sub: 2, find: "Return-Ratio Chart" },
            { label: "Peer percentile view", kw: "peer percentile ratio ranking", loc: "Ratio analysis", tab: 2, sub: 0, find: "Peer Percentile View" },
            { label: "Valuation metrics", kw: "valuation pe pb ps ev ebitda fcf yield multiple", loc: "Ratios & Valuation", tab: 2, sub: 1, find: "P/E Multiple" },
            { label: "Historical P/E band", kw: "pe band historical valuation cheap expensive median", loc: "Valuation metrics", tab: 2, sub: 1, find: "Historical P/E Band" },
            { label: "Peer valuation table", kw: "peer valuation table pe sector median", loc: "Valuation metrics", tab: 2, sub: 1, find: "Peer Valuation" },
            { label: "Intrinsic / fair value", kw: "intrinsic fair value dcf upside downside sensitivity bear bull", loc: "Ratios & Valuation", tab: 2, sub: 3, find: "Fair-Value Range" },
            { label: "Debt Panel", kw: "debt panel leverage net debt ebitda interest coverage", loc: "Debt analysis", tab: 3, sub: 0, find: "Debt Panel" },
            { label: "Solvency score & risk alerts", kw: "solvency score risk alerts strong weak", loc: "Debt analysis", tab: 3, sub: 0, find: "Solvency Score" },
            { label: "Cash flow (CFO, FCF, Capex)", kw: "cash flow cfo fcf free cash flow capex conversion warning flags", loc: "Cash flow analysis", tab: 3, sub: 1, find: "Cash Conversion" },
            { label: "Shareholding pattern", kw: "shareholding pattern ownership split promoter public institutional composition", loc: "Ownership", tab: 4, sub: 0, find: "Ownership Split" },
            { label: "Promoter holding & pledge", kw: "promoter holding pledge governance risk marker", loc: "Ownership", tab: 4, sub: 1, find: "Promoter Holding" },
            { label: "Institutional flow (FII / DII)", kw: "institutional fii dii fpi flow net buying selling interest", loc: "Ownership", tab: 4, sub: 2, find: "Institutional Flow" },
            { label: "Peer comparison", kw: "peer comparison peers best worst ranking table multiples", loc: "Peers & Sector", tab: 5, sub: 0, find: "Sector Peer Comparison" },
            { label: "Symbol", kw: "symbol ticker peer column", loc: "Peer comparison", tab: 5, sub: 0, find: "Sector Peer Comparison" },
            { label: "Operating margin", kw: "operating margin op margin ebit", loc: "Peer comparison", tab: 5, sub: 0, find: "Sector Peer Comparison" },
            { label: "Operating margin", kw: "operating margin op margin", loc: "Ratio analysis", tab: 2, sub: 0, find: "Ratio" },
            { label: "Rev growth / D/E (peer)", kw: "rev growth revenue growth debt equity peer column", loc: "Peer comparison", tab: 5, sub: 0, find: "Sector Peer Comparison" },
            { label: "Price (peer)", kw: "price last price peer column", loc: "Peer comparison", tab: 5, sub: 0, find: "Sector Peer Comparison" },
            { label: "Sector comparison & percentile", kw: "sector comparison benchmark percentile standing", loc: "Peers & Sector", tab: 5, sub: 1, find: "Sector Percentile" },
            { label: "Business understanding / how it makes money", kw: "business model how they make money revenue drivers segments cost structure expenses", loc: "AI Insights", tab: 6, sub: 0, find: "Business Understanding" },
            { label: "Business quality score", kw: "business quality score sub-scores rationale chips", loc: "AI Insights", tab: 6, sub: 0, find: "Composite Quality" },
            { label: "Annual report / concall summary", kw: "annual report concall summary management commentary", loc: "AI Insights", tab: 6, sub: 1, find: "Annual Report" },
            { label: "Earnings forecast / scenarios", kw: "earnings estimate forecast scenario bull base bear projection", loc: "AI Insights", tab: 6, sub: 2, find: "Scenario Forecast" },
            { label: "Red-flag / forensic checklist", kw: "red flag forensic accounting checklist severity", loc: "AI Insights", tab: 6, sub: 3, find: "Forensic" },
            { label: "Moat / quality assessment", kw: "moat pricing power barriers entry confidence", loc: "AI Insights", tab: 6, sub: 4, find: "Moat Audit" },
            { label: "Export / download PDF report", kw: "export pdf report download print", loc: "Export", tab: 7, sub: 0 },
        ];

        // Dashboard navigation search: type any term -> dropdown -> jump to the panel.
        const DashboardSearch = ({ setActiveTab, setActiveSubTab }) => {
            const [query, setQuery] = useState('');
            const [open, setOpen] = useState(false);
            const [active, setActive] = useState(0);
            const boxRef = useRef(null);
            useEffect(() => {
                const onDocClick = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
                document.addEventListener('mousedown', onDocClick);
                return () => document.removeEventListener('mousedown', onDocClick);
            }, []);
            const q = query.trim().toLowerCase();
            const matches = q.length === 0 ? [] : SEARCH_INDEX.filter(it =>
                it.label.toLowerCase().includes(q) || it.kw.toLowerCase().includes(q) || (it.loc || '').toLowerCase().includes(q)
            ).slice(0, 8);
            const go = (item) => {
                if (!item) return;
                setActiveTab(item.tab);
                setActiveSubTab(p => ({ ...p, [item.tab]: item.sub }));
                setQuery(''); setOpen(false); setActive(0);
                setTimeout(() => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    if (item.find) {
                        const els = Array.from(document.querySelectorAll('main h4, main h2, main th'));
                        const el = els.find(e => (e.textContent || '').toLowerCase().includes(item.find.toLowerCase()));
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 280);
            };
            const onKey = (e) => {
                if (!open || matches.length === 0) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); setActive(a => Math.min(a + 1, matches.length - 1)); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
                else if (e.key === 'Enter') { e.preventDefault(); go(matches[active]); }
                else if (e.key === 'Escape') { setOpen(false); }
            };
            return (
                <div className="relative w-full" ref={boxRef}>
                    <div className="relative flex items-center rounded-lg bg-slate-950 border border-slate-800 focus-within:border-blue-600 focus-within:ring-1 focus-within:ring-blue-600/30 transition">
                        <div className="pl-3 text-slate-500"><SearchIcon /></div>
                        <input
                            type="text"
                            value={query}
                            onChange={(e) => { setQuery(e.target.value); setOpen(true); setActive(0); }}
                            onFocus={() => setOpen(true)}
                            onKeyDown={onKey}
                            placeholder="Ask the agent — find KPI movement, PAT, solvency score, moat…"
                            className="w-full bg-transparent border-0 outline-none text-slate-200 pl-2.5 pr-4 py-2.5 placeholder-slate-500 text-xs font-medium"
                        />
                    </div>
                    {open && matches.length > 0 && (
                        <div className="nv-float absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-800 rounded-lg z-50 max-h-80 overflow-y-auto divide-y divide-slate-800/60">
                            {matches.map((m, i) => {
                                const dup = matches.filter(x => x.label === m.label).length > 1;
                                return (
                                <button
                                    key={i}
                                    type="button"
                                    onMouseEnter={() => setActive(i)}
                                    onClick={() => go(m)}
                                    className={`w-full px-3.5 py-2.5 text-left transition ${i === active ? 'bg-blue-500/10' : 'hover:bg-slate-850'}`}
                                >
                                    <span className="text-xs font-semibold text-slate-200">{m.label}</span>
                                    {dup && <span className="text-[10px] text-slate-500 font-medium"> &nbsp;({m.loc})</span>}
                                </button>
                                );
                            })}
                        </div>
                    )}
                    {open && q.length > 0 && matches.length === 0 && (
                        <div className="nv-float absolute left-0 right-0 mt-1 bg-slate-900 border border-slate-800 rounded-lg z-50 px-3.5 py-3 text-[11px] text-slate-500">
                            No match. Try “KPI”, “PAT”, “pledge”, “FII”, “fair value”, “moat”…
                        </div>
                    )}
                </div>
            );
        };

        // Live price ticker — polls the lightweight /api/quote endpoint so the
        // dashboard shows a real-time LTP that refreshes on an interval (Angel One
        // live tick when configured, ~15-min delayed yfinance otherwise).
        const LivePriceTicker = ({ symbol }) => {
            const [quote, setQuote] = useState(null);
            useEffect(() => {
                if (!symbol) return;
                let active = true;
                const token = localStorage.getItem(TOKEN_KEY);
                const poll = () => {
                    fetch(`${API_BASE}/api/quote?symbol=${encodeURIComponent(symbol)}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                        .then(r => (r.ok ? r.json() : null))
                        .then(d => { if (active && d) setQuote(d); })
                        .catch(() => {});
                };
                poll();
                const id = setInterval(poll, 30000);
                return () => { active = false; clearInterval(id); };
            }, [symbol]);

            if (!quote || quote.ltp == null) return null;
            const up = (quote.change ?? 0) >= 0;
            const isLive = quote.source === 'angel';
            return (
                <div className="mt-2 flex items-center gap-2 flex-wrap font-sans">
                    <span className="font-heading text-lg font-extrabold text-slate-100">
                        ₹{Number(quote.ltp).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                    </span>
                    {quote.change != null && (
                        <span className={`text-[11px] font-bold font-mono ${up ? 'text-emerald-400' : 'text-red-400'}`}>
                            {up ? '▲' : '▼'} {up ? '+' : ''}{quote.change} ({up ? '+' : ''}{quote.change_pct}%)
                        </span>
                    )}
                    <span className={`text-[8px] uppercase tracking-wider rounded px-1 py-0.5 border ${isLive ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' : 'text-slate-500 border-slate-700'}`}>
                        {isLive ? '● Live' : 'Delayed'}
                    </span>
                </div>
            );
        };

        // Floating instrument card that slides in from the top once the user
        // scrolls past the main header, so the live price + score stay visible.
        const StickyQuoteCard = ({ symbol, name, score, visible }) => {
            const [quote, setQuote] = useState(null);
            useEffect(() => {
                if (!symbol) return;
                let active = true;
                const token = localStorage.getItem(TOKEN_KEY);
                const poll = () => {
                    fetch(`${API_BASE}/api/quote?symbol=${encodeURIComponent(symbol)}`, { headers: { 'Authorization': `Bearer ${token}` } })
                        .then(r => (r.ok ? r.json() : null)).then(d => { if (active && d) setQuote(d); }).catch(() => {});
                };
                poll();
                const id = setInterval(poll, 30000);
                return () => { active = false; clearInterval(id); };
            }, [symbol]);
            const [open, setOpen] = useState(false);
            const up = (quote && quote.change != null ? quote.change : 0) >= 0;
            const ltp = quote && quote.ltp != null ? `₹${Number(quote.ltp).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : '…';
            return (
                <div
                    className={`hidden md:block fixed bottom-4 left-4 z-40 transition-all duration-300 ease-out ${visible ? 'translate-y-0 opacity-100' : 'translate-y-6 opacity-0 pointer-events-none'}`}
                    onMouseEnter={() => setOpen(true)}
                    onMouseLeave={() => setOpen(false)}
                >
                    {/* Expanded card (pops up above the bubble on hover/tap) */}
                    <div className={`absolute bottom-full left-0 mb-2 w-48 origin-bottom-left transition-all duration-200 ${open ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'}`}>
                        <div className="nv-float bg-slate-900 border border-slate-800 rounded-xl p-3">
                            <div className="text-[10px] text-slate-500 truncate mb-1.5">{name}</div>
                            {quote && quote.ltp != null ? (
                                <div>
                                    <div className="font-heading text-lg font-extrabold text-slate-100 leading-tight">{ltp}</div>
                                    {quote.change != null && <div className={`text-[11px] font-bold font-mono ${up ? 'text-emerald-400' : 'text-red-400'}`}>{up ? '▲ +' : '▼ '}{quote.change} ({up ? '+' : ''}{quote.change_pct}%)</div>}
                                </div>

                            <div className="mt-2 pt-2 border-t border-slate-800 flex items-center justify-between">
                                <span className="text-[9px] text-slate-500 font-bold uppercase tracking-wider">Quality</span>
                                <span className="text-sm font-extrabold text-blue-600">{score}<span className="text-[10px] text-slate-400 font-bold">/100</span></span>

                    {/* Compact bubble (always visible while scrolled) */}
                    <button

                        onClick={() => setOpen(o => !o)}
                        className="nv-float flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full pl-1.5 pr-3 py-1.5 hover:border-blue-500/40 transition"
                    >
                        <img src="/frontend/navrist-logo.svg" alt="" className="w-6 h-6 object-contain rounded-full bg-white p-0.5" />
                        <span className="text-[11px] font-bold text-blue-600 font-mono">{symbol}</span>
                        <span className="text-[11px] font-bold text-slate-200 font-mono">{ltp}</span>
                        {quote && quote.change_pct != null && <span className={`text-[10px] font-bold font-mono ${up ? 'text-emerald-400' : 'text-red-400'}`}>{up ? '+' : ''}{quote.change_pct}%</span>}
                    </button>
                </div>
            );
        };

        // Custom SVG Icon Components
        const SearchIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        );

        const FileTextIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-file-text"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        );

        const PrinterIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-printer"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
        );

        const ExternalLinkIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        );

        const AlertTriangleIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-alert-triangle"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
        );

        const InfoIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-info"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        const BriefcaseIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-briefcase"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
        );

        const ArrowDownIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-arrow-down"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        );

        // --- SUBCOMPONENT: Custom SVG Return Ratio Bar Chart ---
        const ReturnRatiosChart = ({ ratios }) => {
            if (!ratios || ratios.length === 0) {
                return <div className="text-center p-6 text-xs text-slate-500">No Return Ratios data available to plot chart.</div>;
            }

            // Copy and reverse chronological order (so chart goes from oldest to newest)
            const sortedData = [...ratios].reverse();
            const width = 500;
            const height = 220;
            const padding = { top: 20, right: 20, bottom: 30, left: 40 };
            
            // Find max ratio to dynamically scale
            let maxVal = 0.30; // Min scale at 30%
            sortedData.forEach(d => {
                if (d.ROE && d.ROE > maxVal) maxVal = d.ROE;
                if (d.ROCE && d.ROCE > maxVal) maxVal = d.ROCE;
            });
            maxVal *= 1.15; // padding top

            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            return (
                <div className="w-full flex flex-col items-center p-4 bg-slate-950 border border-slate-800 rounded-lg">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-lg">
                        {/* Horizontal Grid lines */}
                        {[0, 0.25, 0.5, 0.75, 1.0].map((ratio, i) => {
                            const y = padding.top + chartHeight * (1 - ratio);
                            const label = (ratio * maxVal * 100).toFixed(0) + "%";
                            return (
                                <g key={i} className="opacity-40">
                                    <line x1={padding.left} y1={y} x2={width - padding.right} y2={y} stroke="#1e293b" strokeWidth="1" strokeDasharray="3 3" />
                                    <text x={padding.left - 8} y={y + 3} fill="#64748b" fontSize="8" textAnchor="end" className="font-semibold font-sans">{label}</text>
                                </g>
                            );
                        })}
                        
                        {/* Columns / Bars */}
                        {sortedData.map((d, index) => {
                            const numBars = sortedData.length;
                            const sectionWidth = chartWidth / numBars;
                            const groupWidth = sectionWidth * 0.7;
                            const barWidth = groupWidth * 0.45;
                            const groupX = padding.left + (index * sectionWidth) + (sectionWidth - groupWidth) / 2;
                            
                            const roeHeight = d.ROE ? (d.ROE / maxVal) * chartHeight : 0;
                            const roceHeight = d.ROCE ? (d.ROCE / maxVal) * chartHeight : 0;
                            
                            const roeY = padding.top + chartHeight - roeHeight;
                            const roceY = padding.top + chartHeight - roceHeight;
                            
                            return (
                                <g key={index}>
                                    {/* ROE Bar (Blue) */}
                                    {d.ROE !== null && d.ROE !== undefined && (
                                        <rect 
                                            x={groupX} 
                                            y={roeY} 
                                            width={barWidth} 
                                            height={roeHeight} 
                                            fill="#3b82f6" 
                                            rx="1"
                                            className="transition-all duration-300 hover:fill-blue-400 cursor-pointer"
                                        >
                                            <title>{`Year: ${d.date}\nROE: ${(d.ROE * 100).toFixed(2)}%`}</title>
                                        </rect>
                                    )}
                                    {/* ROCE Bar (Teal) */}
                                    {d.ROCE !== null && d.ROCE !== undefined && (
                                        <rect 
                                            x={groupX + barWidth + (groupWidth * 0.1)} 
                                            y={roceY} 
                                            width={barWidth} 
                                            height={roceHeight} 
                                            fill="#14b8a6" 
                                            rx="1"
                                            className="transition-all duration-300 hover:fill-teal-400 cursor-pointer"
                                        >
                                            <title>{`Year: ${d.date}\nROCE: ${(d.ROCE * 100).toFixed(2)}%`}</title>
                                        </rect>
                                    )}
                                    {/* X Axis Date */}
                                    <text 
                                        x={groupX + groupWidth / 2} 
                                        y={height - padding.bottom + 14} 
                                        fill="#64748b" 
                                        fontSize="8" 
                                        textAnchor="middle" 
                                        className="font-bold font-sans"
                                    >
                                        {d.date.substring(0, 4)}
                                    </text>
                                </g>
                            );
                        })}
                        {/* Baseline */}
                        <line x1={padding.left} y1={padding.top + chartHeight} x2={width - padding.right} y2={padding.top + chartHeight} stroke="#334155" strokeWidth="1.5" />
                    </svg>
                    
                    {/* Legend */}
                    <div className="flex gap-4 mt-2 text-[10px] font-semibold">
                        <div className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-blue-500"></span>
                            <span className="text-slate-400">ROE (Return on Equity)</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                            <span className="w-2 h-2 rounded-sm bg-teal-500"></span>
                            <span className="text-slate-400">ROCE (Return on Capital Employed)</span>
                        </div>
                    </div>
                </div>
            );
        };

        // --- SUBCOMPONENT: Reusable multi-series trend chart (line + area) with hover tooltip ---
        // rows: [{label, [key]:number, ...}]; series: [{key,label,color}]; fmt(v)->string for axis/tooltip.
        const TrendChart = ({ rows, series, fmt = (v) => v, height = 150, refLine = null }) => {
            const [hi, setHi] = useState(null);
            const svgRef = useRef(null);
            const clean = (rows || []).filter(r => series.some(s => r[s.key] != null && !isNaN(r[s.key])));
            if (clean.length < 2) return <div className="text-center p-6 text-xs text-slate-500">Not enough data points to plot a trend.</div>;
            const W = 560, H = height, P = { t: 16, r: 16, b: 26, l: 66 };
            const cw = W - P.l - P.r, ch = H - P.t - P.b;
            const all = clean.flatMap(r => series.map(s => r[s.key])).filter(v => v != null && !isNaN(v));
            let min = Math.min(...all), max = Math.max(...all);
            if (min === max) { min -= 1; max += 1; }
            if (min > 0) min = min - (max - min) * 0.15;
            max = max + (max - min) * 0.12;
            const x = (i) => P.l + (clean.length === 1 ? cw / 2 : (i / (clean.length - 1)) * cw);
            const y = (v) => P.t + ch * (1 - (v - min) / (max - min));
            const ticks = [max, (max + min) / 2, min];
            const showDots = clean.length <= 16;
            const onMove = (e) => {
                const rect = svgRef.current.getBoundingClientRect();
                const sx = ((e.clientX - rect.left) / rect.width) * W;
                let idx = Math.round(((sx - P.l) / cw) * (clean.length - 1));
                idx = Math.max(0, Math.min(clean.length - 1, idx));
                setHi(idx);
            };
            const hv = hi != null ? clean[hi] : null;
            const tipW = 168, tipRight = hi != null && x(hi) > W - tipW - 8;
            return (
                <div className="w-full p-4 bg-slate-950 border border-slate-800 rounded-lg">
                    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" onMouseMove={onMove} onMouseLeave={() => setHi(null)} style={{ cursor: 'crosshair' }}>
                        {ticks.map((tv, i) => (
                            <g key={i}>
                                <line x1={P.l} y1={y(tv)} x2={W - P.r} y2={y(tv)} stroke="#e2e8f0" strokeWidth="1" strokeDasharray="3 3" />
                                <text x={P.l - 8} y={y(tv) + 3} fill="#94a3b8" fontSize="9" textAnchor="end" className="font-semibold">{fmt(tv)}</text>
                            </g>
                        ))}
                        {series.map((s, si) => {
                            const pts = clean.map((r, i) => (r[s.key] == null || isNaN(r[s.key])) ? null : `${x(i)},${y(r[s.key])}`).filter(Boolean).join(' ');
                            const firstX = x(0), lastX = x(clean.length - 1), baseY = P.t + ch;
                            return (
                                <g key={s.key}>
                                    {si === 0 && <polygon points={`${firstX},${baseY} ${pts} ${lastX},${baseY}`} fill={s.color} opacity="0.08" />}
                                    <polyline points={pts} fill="none" stroke={s.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                                    {showDots && clean.map((r, i) => (r[s.key] == null || isNaN(r[s.key])) ? null : (
                                        <circle key={i} cx={x(i)} cy={y(r[s.key])} r={i === clean.length - 1 ? 3.5 : 2.5} fill={s.color} />
                                    ))}
                                </g>
                            );
                        })}
                        {/* optional reference line (e.g. selected P/E band level) */}
                        {refLine && refLine.value != null && refLine.value >= min && refLine.value <= max && (
                            <g>
                                <line x1={P.l} y1={y(refLine.value)} x2={W - P.r} y2={y(refLine.value)} stroke={refLine.color || '#2563eb'} strokeWidth="1.5" strokeDasharray="5 3" />
                                <text x={W - P.r} y={y(refLine.value) - 4} fill={refLine.color || '#2563eb'} fontSize="9" textAnchor="end" className="font-bold">{refLine.label}</text>
                            </g>
                        )}
                        {/* x-axis labels (thinned) */}
                        {(() => { const step = Math.max(1, Math.ceil(clean.length / 7)); return clean.map((r, i) => (
                            (i % step === 0 || i === clean.length - 1)
                                ? <text key={i} x={x(i)} y={H - P.b + 16} fill="#94a3b8" fontSize="9" textAnchor="middle" className="font-bold">{String(r.label).substring(0, 7)}</text>
                                : null
                        )); })()}
                        {/* hover crosshair + markers + tooltip */}
                        {hv && (
                            <g>
                                <line x1={x(hi)} y1={P.t} x2={x(hi)} y2={P.t + ch} stroke="#94a3b8" strokeWidth="1" strokeDasharray="3 3" />
                                {series.map(s => (hv[s.key] == null || isNaN(hv[s.key])) ? null : (
                                    <circle key={s.key} cx={x(hi)} cy={y(hv[s.key])} r="3.5" fill="#fff" stroke={s.color} strokeWidth="2" />
                                ))}
                                <g transform={`translate(${tipRight ? x(hi) - tipW - 8 : x(hi) + 8}, ${P.t + 4})`}>
                                    <rect width={tipW} height={18 + series.length * 14} rx="5" fill="#0f172a" opacity="0.92" />
                                    <text x="8" y="14" fill="#cbd5e1" fontSize="9" className="font-bold">{hv.label}</text>
                                    {series.map((s, si) => (hv[s.key] == null || isNaN(hv[s.key])) ? null : (
                                        <g key={s.key} transform={`translate(8, ${26 + si * 14})`}>
                                            <rect width="7" height="7" y="-7" rx="1.5" fill={s.color} />
                                            <text x="12" y="0" fill="#e2e8f0" fontSize="9.5" className="font-semibold">{s.label}: {fmt(hv[s.key])}</text>
                                        </g>
                                    ))}
                                </g>
                            </g>
                        )}
                    </svg>
                    <div className="flex flex-wrap gap-4 justify-center mt-1 text-[10px] font-semibold">
                        {series.map(s => (
                            <div key={s.key} className="flex items-center gap-1.5">
                                <span className="w-2.5 h-2.5 rounded-sm" style={{ background: s.color }}></span>
                                <span className="text-slate-500">{s.label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- SUBCOMPONENT: collapsible section — keeps the heading visible with a
        // side "Show / Hide" toggle; content is hidden until the user opens it.
        // Used to fold away AI Insights sections we're not currently focused on.
        const CollapsibleSection = ({ title, children, defaultOpen = false }) => {
            const [open, setOpen] = useState(defaultOpen);
            return (
                <div>
                    <div className="flex items-center justify-between gap-2 border-l-2 border-blue-500 pl-3">
                        <h3 className="font-heading text-sm font-bold text-slate-100 uppercase tracking-wider">{title}</h3>
                        <button onClick={() => setOpen(o => !o)}
                            className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md border border-slate-700 text-slate-300 hover:text-white hover:border-slate-500 hover:bg-slate-800 transition flex-shrink-0">
                            {open ? 'Hide ▴' : 'Show ▾'}
                        </button>
                    </div>
                    {open && <div className="mt-3">{children}</div>}
                </div>
            );
        };

        // --- SUBCOMPONENT: PIE chart (full circle) with hover value ---
        const Donut = ({ data, fmt = (v) => v, unit = '' }) => {
            const [hi, setHi] = useState(null);
            const items = (data || []).filter(d => d.value != null && d.value > 0);
            if (!items.length) return <div className="text-center p-4 text-[11px] text-slate-500">No data to chart.</div>;
            const total = items.reduce((s, d) => s + d.value, 0);
            const palette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#ef4444', '#64748b'];
            const cx = 60, cy = 60, R = 56;
            let ang = -Math.PI / 2;
            const slices = items.map((d, i) => {
                const frac = d.value / total, a0 = ang, a1 = ang + frac * 2 * Math.PI; ang = a1;
                const rr = hi === i ? R + 3 : R;
                const large = (a1 - a0) > Math.PI ? 1 : 0;
                const path = items.length === 1
                    ? `M ${cx} ${cy} m -${rr} 0 a ${rr} ${rr} 0 1 0 ${rr * 2} 0 a ${rr} ${rr} 0 1 0 -${rr * 2} 0`
                    : `M ${cx} ${cy} L ${(cx + rr * Math.cos(a0)).toFixed(2)} ${(cy + rr * Math.sin(a0)).toFixed(2)} A ${rr} ${rr} 0 ${large} 1 ${(cx + rr * Math.cos(a1)).toFixed(2)} ${(cy + rr * Math.sin(a1)).toFixed(2)} Z`;
                return { ...d, frac, path, color: d.color || palette[i % palette.length] };
            });
            return (
                <div className="flex items-center gap-4">
                    <svg viewBox="0 0 124 124" className="w-28 h-28 flex-shrink-0">
                        {slices.map((s, i) => (
                            <path key={i} d={s.path} fill={s.color} stroke="#0b1220" strokeWidth="1"
                                opacity={hi == null || hi === i ? 1 : 0.5}
                                onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} style={{ cursor: 'pointer' }} />
                        ))}
                    </svg>
                    <div className="flex-1 space-y-1 min-w-0">
                        {slices.map((s, i) => (
                            <div key={i} onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)}
                                className={`flex items-start justify-between gap-2 text-[11px] rounded px-1.5 py-1 ${hi === i ? 'bg-slate-800' : ''}`}>
                                <span className="flex items-start gap-1.5 min-w-0"><span className="w-2.5 h-2.5 rounded-sm flex-shrink-0 mt-0.5" style={{ background: s.color }}></span><span className="text-slate-200 leading-snug">{s.label}</span></span>
                                <span className="font-mono text-slate-300 whitespace-nowrap">{parseFloat((s.frac * 100).toFixed(2))}%{unit ? ` · ${fmt(s.value)}${unit}` : ''}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- SUBCOMPONENT: Revenue streams — pie of how the company makes money,
        // with each stream expandable (tap the row) to reveal its plain-English
        // "how it earns" detail. Falls back to the driver text if no structured
        // streams were produced.
        const RevenueStreams = ({ streams, drivers, source }) => {
            const [openIdx, setOpenIdx] = useState(null);
            const s = (streams || []).filter(x => x && x.name);
            const withPct = s.filter(x => x.pct != null && Number(x.pct) > 0);
            const pieData = withPct.map(x => ({ label: x.name, value: Number(x.pct) }));
            const isEstimate = source && /estimate|business-model|derived/i.test(source);
            return (
                <div className="p-4 bg-slate-950 border border-slate-800 rounded-lg">
                    <p className="text-[11px] text-slate-400 mb-2.5">How the company makes money{s.some(x => x.desc) ? ' — tap a stream for detail' : ''}</p>
                    {pieData.length > 0 && (
                        <div className="mb-3"><Donut data={pieData} fmt={(v) => Number(v).toFixed(0)} unit="% share" /></div>
                    )}
                    {s.length > 0 ? (
                        <ul className="space-y-1 bmc-scroll max-h-[320px] overflow-y-auto pr-1">
                            {s.map((x, i) => (
                                <li key={i} className="rounded-md border border-slate-800/70 bg-slate-900/40">
                                    <button onClick={() => x.desc && setOpenIdx(openIdx === i ? null : i)}
                                        className={`w-full flex items-center justify-between gap-2 px-2.5 py-2 text-left transition ${x.desc ? 'hover:bg-slate-800/50 cursor-pointer' : 'cursor-default'}`}>
                                        <span className="flex items-center gap-2 min-w-0">
                                            <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: '#16a34a' }}></span>
                                            <span className="text-[11px] text-slate-200 font-semibold truncate">{x.name}</span>
                                        </span>
                                        <span className="flex items-center gap-2 flex-shrink-0">
                                            {x.pct != null && <span className="text-[10px] font-mono text-slate-400">~{Number(x.pct).toFixed(0)}%</span>}
                                            {x.desc && <span className="text-[9px] text-slate-500 w-2">{openIdx === i ? '▴' : '▾'}</span>}
                                        </span>
                                    </button>
                                    {openIdx === i && x.desc && (
                                        <p className="px-4 pb-2.5 pt-0.5 text-[11px] text-slate-400 leading-relaxed">{x.desc}</p>
                                    )}
                                </li>
                            ))}
                        </ul>
                    ) : (drivers || []).length ? (
                        <ul className="space-y-1.5">
                            {(drivers || []).map((d, i) => (
                                <li key={i} className="flex items-start gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style={{ background: '#16a34a' }}></span>
                                    <span className="text-[11px] text-slate-300 leading-relaxed">{d}</span>
                                </li>
                            ))}
                        </ul>
                    ) : (
                        <p className="text-[10px] text-slate-600 italic">Not yet available — regenerate report to populate.</p>
                    )}
                    {isEstimate && s.length > 0 && (
                        <p className="text-[9px] text-slate-600 italic mt-2">Approximate revenue mix inferred from the business model — indicative shares, not audited segment figures.</p>
                    )}
                </div>
            );
        };

        // --- Clean line-style SVG icons for the Business Model Canvas (no emoji) ---
        const BmcIcon = ({ name, className = "w-3.5 h-3.5" }) => {
            const paths = {
                partnerships: <g><circle cx="6.5" cy="12" r="3.2" /><circle cx="17.5" cy="12" r="3.2" /><path d="M9.7 12h4.6" /></g>,
                activities:   <path d="M3 12h4l2.5 6 4-13 2.5 7H21" />,
                value:        <path d="M12 3.2l2.5 5.6 6.1.6-4.6 4.1 1.4 6L12 16.6 6.6 19.5 8 13.5 3.4 9.4l6.1-.6z" />,
                relationships:<path d="M20.4 6.1a4.3 4.3 0 00-6.1 0L12 8.4 9.7 6.1a4.3 4.3 0 10-6.1 6.1L12 20.6l8.4-8.4a4.3 4.3 0 000-6.1z" />,
                segments:     <g><circle cx="9" cy="8" r="3" /><path d="M3.5 20a5.5 5.5 0 0111 0" /><path d="M16 5.5a3 3 0 010 5.8" /><path d="M18.5 20a5.5 5.5 0 00-3-4.9" /></g>,
                resources:    <g><path d="M12 3.5l8 3.7-8 3.7-8-3.7z" /><path d="M4 12l8 3.7 8-3.7" /><path d="M4 16.5l8 3.7 8-3.7" /></g>,
                channels:     <path d="M21.5 3.5l-9.5 9.5M21.5 3.5l-6 17-4-8-8-4z" />,
                cost:         <g><rect x="3" y="6.5" width="18" height="12" rx="2.2" /><path d="M3 10.5h18" /><circle cx="16.5" cy="14.5" r="1.1" fill="currentColor" stroke="none" /></g>,
                revenue:      <g><path d="M3 17l6-6 4 4 8-8" /><path d="M16 7h5v5" /></g>,
            };
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9"
                    strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {paths[name] || null}
                </svg>
            );
        };

        // --- SUBCOMPONENT: vertical mini bar chart (real time-series), light theme, hover ---
        const MiniBars = ({ data, fmt = (v) => v, unit = '', color = '#2563eb' }) => {
            const [hi, setHi] = useState(null);
            const items = (data || []).filter(d => d.value != null && !isNaN(d.value));
            if (items.length < 2) return <div className="text-center py-4 text-[10px] text-slate-500">Not enough data to chart.</div>;
            const vals = items.map(d => d.value);
            const max = Math.max(...vals), min = Math.min(0, ...vals);
            const span = (max - min) || 1;
            const W = 280, H = 116, P = { t: 18, b: 20, l: 4, r: 4 };
            const iw = (W - P.l - P.r) / items.length;
            const bw = Math.min(iw * 0.5, 24);
            const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - min) / span);
            const y0 = y(0);
            return (
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: '150px' }} preserveAspectRatio="xMidYMid meet">
                    <line x1={P.l} y1={y0} x2={W - P.r} y2={y0} stroke="#e2e8f0" strokeWidth="1" />
                    {items.map((d, i) => {
                        const cx = P.l + iw * i + iw / 2;
                        const top = y(d.value);
                        const last = i === items.length - 1;
                        return (
                            <g key={i} onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} style={{ cursor: 'pointer' }}>
                                <rect x={cx - bw / 2} y={Math.min(top, y0)} width={bw} height={Math.max(Math.abs(top - y0), 1)} rx="2.5"
                                    fill={hi === i ? color : (last ? color : '#bfdbfe')} opacity={hi == null || hi === i ? 1 : 0.55} />
                                <text x={cx} y={H - 6} textAnchor="middle" fontSize="8" fill="#94a3b8" className="font-bold">{d.label}</text>
                                {hi === i && <text x={cx} y={Math.min(top, y0) - 4} textAnchor="middle" fontSize="8.5" fill="#0f172a" className="font-bold">{fmt(d.value)}{unit}</text>}
                            </g>
                        );
                    })}
                </svg>
            );
        };

        // --- SUBCOMPONENT: Radar / spider chart with hover (for moat aspects out of 10) ---
        const RadarChart = ({ axes }) => {
            // axes: [{label, value(0-10)}]
            const [hi, setHi] = useState(null);
            const pts = (axes || []).filter(a => a.value != null);
            if (pts.length < 3) return null;
            const cx = 130, cy = 120, R = 88, n = pts.length;
            const ang = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;
            const at = (i, rad) => [cx + rad * Math.cos(ang(i)), cy + rad * Math.sin(ang(i))];
            const rings = [2, 4, 6, 8, 10];
            const poly = pts.map((p, i) => at(i, R * (Math.max(0, Math.min(10, p.value)) / 10)).map(v => v.toFixed(1)).join(',')).join(' ');
            return (
                <div className="flex flex-col items-center">
                    <svg viewBox="0 0 260 250" className="w-full max-w-[340px]">
                        {rings.map((rv, ri) => (
                            <polygon key={ri} points={pts.map((_, i) => at(i, R * rv / 10).map(v => v.toFixed(1)).join(',')).join(' ')} fill="none" stroke="#1e293b" strokeWidth="1" />
                        ))}
                        {pts.map((_, i) => { const [x, y] = at(i, R); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#1e293b" strokeWidth="1" />; })}
                        <polygon points={poly} fill="#3b82f6" fillOpacity="0.22" stroke="#3b82f6" strokeWidth="2" />
                        {pts.map((p, i) => { const [x, y] = at(i, R * (Math.max(0, Math.min(10, p.value)) / 10)); return (
                            <circle key={i} cx={x} cy={y} r={hi === i ? 5 : 3.5} fill={hi === i ? '#fff' : '#3b82f6'} stroke="#3b82f6" strokeWidth="2"
                                onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} style={{ cursor: 'pointer' }} />
                        ); })}
                        {pts.map((p, i) => { const [x, y] = at(i, R + 16); return (
                            <text key={i} x={x} y={y} textAnchor={Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end'} dominantBaseline="middle"
                                fontSize="8.5" fill={hi === i ? '#e2e8f0' : '#94a3b8'} className="font-semibold">{p.label.length > 16 ? p.label.slice(0, 15) + '…' : p.label}</text>
                        ); })}
                        {hi != null && (() => { const [x, y] = at(hi, R * (Math.max(0, Math.min(10, pts[hi].value)) / 10)); return (
                            <g transform={`translate(${x > cx ? x - 66 : x + 6}, ${y - 10})`}>
                                <rect width="60" height="16" rx="4" fill="#0f172a" opacity="0.95" />
                                <text x="6" y="11" fontSize="9" fill="#e2e8f0" className="font-bold">{pts[hi].value}/10</text>
                            </g>
                        ); })()}
                    </svg>
                </div>
            );
        };

        // --- SUBCOMPONENT: horizontal percentile bars for every peer (target highlighted) ---
        const PeerPercentileBars = ({ ranking }) => {
            const [hi, setHi] = useState(null);
            const rows = (ranking || []).filter(r => r.percentile != null);
            if (!rows.length) return null;
            return (
                <div className="space-y-1.5">
                    {rows.map((r, i) => (
                        <div key={i} onMouseEnter={() => setHi(i)} onMouseLeave={() => setHi(null)} className="space-y-0.5">
                            <div className="flex justify-between text-[10px]">
                                <span className={`truncate ${r.is_target ? 'font-bold text-blue-300' : 'text-slate-400'}`}>{r.is_target ? '★ ' : ''}{r.name}</span>
                                <span className={`font-mono ${r.is_target ? 'text-blue-300 font-bold' : 'text-slate-400'}`}>{r.percentile}th</span>
                            </div>
                            <div className="w-full h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
                                <div className={`h-full rounded-full ${r.is_target ? 'bg-blue-500' : 'bg-slate-600'} ${hi === i ? 'opacity-100' : 'opacity-90'}`} style={{ width: `${r.percentile}%` }}></div>
                            </div>
                        </div>
                    ))}
                    <p className="text-[9px] text-slate-500 pt-1">Composite percentile within its size-league (higher = better). ★ = this stock.</p>
                </div>
            );
        };

        // --- SUBCOMPONENT: Peer comparison table — same size-league peers only,
        // per-metric values with percentiles. "Toppers vs toppers": a company is
        // ranked only against its own league, never against index giants. ---
        const PeerComparisonTable = ({ ranking, columns }) => {
            const rows = (ranking || []).filter(r => r.percentile != null);
            if (!rows.length) return null;
            const cols = (columns || []).filter(c => rows.some(r => r.metrics && r.metrics[c.key] && r.metrics[c.key].value != null));
            const fmtVal = (c, v) => v == null ? '—'
                : c.fmt === 'pct_raw' ? `${Number(v).toFixed(1)}%`
                : Number(v) >= 1000 ? Math.round(Number(v)).toLocaleString('en-IN')
                : Number(v).toFixed(1);
            const pctColor = (p) => p == null ? 'text-slate-500' : p >= 67 ? 'text-emerald-400' : p >= 34 ? 'text-blue-400' : 'text-red-400';
            const ord = (p) => p + (p % 10 === 1 && p % 100 !== 11 ? 'st' : p % 10 === 2 && p % 100 !== 12 ? 'nd' : p % 10 === 3 && p % 100 !== 13 ? 'rd' : 'th');
            return (
                <div className="overflow-x-auto">
                    <table className="w-full border-collapse">
                        <thead>
                            <tr className="border-b border-slate-800 bg-slate-955">
                                <th className="p-2 text-left text-[9px] uppercase tracking-wider text-slate-500 font-bold">Company</th>
                                <th className="p-2 text-right text-[9px] uppercase tracking-wider text-slate-500 font-bold">Composite pct</th>
                                {cols.map(c => <th key={c.key} className="p-2 text-right text-[9px] uppercase tracking-wider text-slate-500 font-bold">{c.label}</th>)}
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map((r, i) => (
                                <tr key={i} className={`border-b border-slate-850 ${r.is_target ? 'bg-blue-950' : ''}`}>
                                    <td className={`p-2 text-[11px] whitespace-nowrap ${r.is_target ? 'font-bold text-blue-300' : 'text-slate-300'}`}>{r.is_target ? '★ ' : ''}{r.name}</td>
                                    <td className="p-2 text-right">
                                        <span className={`text-[11px] font-bold font-mono ${pctColor(r.percentile)}`}>{ord(r.percentile)}</span>
                                    </td>
                                    {cols.map(c => {
                                        const m = (r.metrics || {})[c.key] || {};
                                        return (
                                            <td key={c.key} className="p-2 text-right whitespace-nowrap">
                                                <span className="text-[11px] text-slate-200 font-semibold">{fmtVal(c, m.value)}</span>
                                                <span className={`block text-[9px] font-bold ${pctColor(m.pct)}`}>{m.pct != null ? `${ord(m.pct)} pct` : ''}</span>
                                            </td>
                                        );
                                    })}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    <p className="text-[9px] text-slate-500 pt-2">Percentiles are computed ONLY within this size-league (higher = better on every column, valuation inverted). ★ = this stock.</p>
                </div>
            );
        };

        // --- SUBCOMPONENT: Historical P/E band chart with tappable band levels ---
        const PEBand = ({ band }) => {
            const [sel, setSel] = useState('current');
            if (!band || !band.series || band.series.length < 6) return null;
            const rows = band.series.map(s => ({ label: s.date, PE: s.pe }));
            const cheap = band.current < band.median;
            const cards = [
                { k: 'min', l: '5Y Low', v: band.min, c: '#16a34a' },
                { k: 'median', l: '5Y Median', v: band.median, c: '#64748b' },
                { k: 'max', l: '5Y High', v: band.max, c: '#dc2626' },
                { k: 'current', l: 'Current', v: band.current, c: '#2563eb' },
            ];
            const active = cards.find(c => c.k === sel) || cards[3];
            return (
                <div className="p-5 bg-slate-950 border border-slate-800 rounded-lg space-y-3">
                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <h4 className="font-heading text-sm font-bold text-slate-200 uppercase tracking-wider">Historical P/E Band (5Y)</h4>
                        <span className={`text-[9px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md border ${cheap ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' : 'text-amber-400 bg-amber-500/10 border-amber-500/30'}`}>{cheap ? 'Below median — relatively cheap' : 'Above median — relatively expensive'}</span>
                    </div>
                    <TrendChart rows={rows} series={[{ key: 'PE', label: 'P/E', color: '#2563eb' }]} fmt={(v) => `${v.toFixed(0)}x`} height={160} refLine={{ value: active.v, color: active.c, label: `${active.l} ${active.v}x` }} />
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {cards.map(c => (
                            <button key={c.k} type="button" onClick={() => setSel(c.k)} className={`nv-tile p-3 rounded-lg border text-center transition ${sel === c.k ? 'bg-blue-500/10 border-blue-500/40' : 'bg-slate-900 border-slate-800'}`}>
                                <div className="text-[9px] text-slate-500 font-bold uppercase tracking-wider">{c.l}</div>
                                <div className="font-heading text-sm font-extrabold text-slate-200 mt-1">{c.v}x</div>
                            </button>
                        ))}
                    </div>
                    <p className="text-[10px] text-slate-500">Tap a band level to mark it on the chart; hover the line to read the P/E at any month. Trading below the median band generally signals a relatively cheaper valuation.</p>
                </div>
            );
        };

        // --- SUBCOMPONENT: Interactive Projection Growth Slider ---
        const InteractiveProjection = ({ calculatedMetrics, parsedJson }) => {
            // Retrieve actual base numbers
            let baseRev = 10000000000;
            let basePat = 1000000000;
            try {
                const inc = calculatedMetrics?.['F-01_Financial_Statements']?.annual?.income_stmt || {};
                const dates = Object.keys(inc).sort((a, b) => b.localeCompare(a));
                if (dates.length > 0) {
                    const latest = inc[dates[0]];
                    for (const key of Object.keys(latest)) {
                        if (key.toLowerCase().replace(/[\s_]/g, '') === 'totalrevenue' || key.toLowerCase().replace(/[\s_]/g, '') === 'revenue') {
                            baseRev = latest[key] || baseRev;
                        }
                        if (key.toLowerCase().replace(/[\s_]/g, '') === 'netincome' || key.toLowerCase().replace(/[\s_]/g, '') === 'netincomecommonstockholders') {
                            basePat = latest[key] || basePat;
                        }
                    }
                } else {
                    const val = calculatedMetrics?.['F-03_Valuation_Metrics'] || {};
                    if (val.MarketCap) {
                        if (val.PS) baseRev = val.MarketCap / val.PS;
                        if (val.PE) basePat = val.MarketCap / val.PE;
                    }
                }
            } catch(e) {
                console.error("Error setting base statement values:", e);
            }

            // Extract presets from qualitative
            const f15 = parsedJson?.['F-15'] || {};
            const bearPreset = f15.bear?.revenue_growth ? f15.bear.revenue_growth / 100 : 0.05;
            const basePreset = f15.base?.revenue_growth ? f15.base.revenue_growth / 100 : 0.10;
            const bullPreset = f15.bull?.revenue_growth ? f15.bull.revenue_growth / 100 : 0.15;

            const [growthRate, setGrowthRate] = useState(basePreset);
            const [selectedScenario, setSelectedScenario] = useState('base');

            const handleScenarioSelect = (scen) => {
                setSelectedScenario(scen);
                if (scen === 'bear') setGrowthRate(bearPreset);
                if (scen === 'base') setGrowthRate(basePreset);
                if (scen === 'bull') setGrowthRate(bullPreset);
            };

            const handleSliderChange = (val) => {
                setGrowthRate(Number(val));
                setSelectedScenario('custom');
            };

            // Compute dynamic table rows
            const rows = [];
            let currentRev = baseRev;
            let currentPat = basePat;
            for (let i = 1; i <= 5; i++) {
                currentRev = currentRev * (1 + growthRate);
                currentPat = currentPat * (1 + growthRate);
                const margin = currentRev !== 0 ? (currentPat / currentRev) * 100 : 0;
                rows.push({
                    year: `Year +${i}`,
                    revenue: currentRev,
                    pat: currentPat,
                    margin: margin
                });
            }

            // Format monetary sums (null/NaN-safe — real data can omit fields)
            const formatCurrency = (val) => {
                if (val === null || val === undefined || isNaN(val)) return 'N/A';
                if (Math.abs(val) >= 1e7) return `₹${(val / 1e7).toFixed(2)} Cr`;
                if (Math.abs(val) >= 1e5) return `₹${(val / 1e5).toFixed(2)} L`;
                return `₹${val.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
            };

            return (
                <div className="p-5 bg-slate-950 border border-slate-800 rounded-lg space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-3">
                        <div>
                            <h4 className="font-heading text-sm font-bold text-slate-200 uppercase tracking-wider">Macro Scenario Forecast Projections</h4>
                            <p className="text-[10px] text-slate-500 mt-0.5">Project financial sheets 5-years forward based on growth assumptions.</p>
                        </div>
                        <div className="flex p-0.5 bg-slate-900 border border-slate-800 rounded-md">
                            <button onClick={() => handleScenarioSelect('bear')} className={`px-2.5 py-1 text-[10px] font-bold uppercase rounded-sm transition ${selectedScenario === 'bear' ? 'bg-red-500/10 border border-red-500/20 text-red-400 font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>Bear</button>
                            <button onClick={() => handleScenarioSelect('base')} className={`px-2.5 py-1 text-[10px] font-bold uppercase rounded-sm transition ${selectedScenario === 'base' ? 'bg-blue-500/10 border border-blue-500/20 text-blue-400 font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>Base</button>
                            <button onClick={() => handleScenarioSelect('bull')} className={`px-2.5 py-1 text-[10px] font-bold uppercase rounded-sm transition ${selectedScenario === 'bull' ? 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>Bull</button>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <div className="flex justify-between text-xs font-semibold text-slate-300">
                            <span>Adjust Projected Growth Rate:</span>
                            <span className="text-blue-500 font-bold">{(growthRate * 100).toFixed(1)}% YoY</span>
                        </div>
                        <input 
                            type="range" 
                            min="-0.10" 
                            max="0.30" 
                            step="0.005"
                            value={growthRate}
                            onChange={(e) => handleSliderChange(e.target.value)}
                            className="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                        />
                        <div className="flex justify-between text-[9px] font-bold text-slate-600 uppercase">
                            <span>-10% (Contracting)</span>
                            <span>0%</span>
                            <span>+10% (Steady)</span>
                            <span>+20% (Rapid)</span>
                            <span>+30% (Hyper Growth)</span>
                        </div>
                    </div>

                    <div className="overflow-x-auto rounded-lg border border-slate-800">
                        <table className="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr className="border-b border-slate-800 bg-slate-950 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                                    <th className="p-3 text-left">Forecast Horizon</th>
                                    <th className="p-3 text-right">Projected Revenue</th>
                                    <th className="p-3 text-right">Projected Net Income (PAT)</th>
                                    <th className="p-3 text-right">PAT Margin %</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800 bg-slate-950/10 text-slate-300">
                                <tr className="bg-slate-900/10 text-slate-500 font-medium">
                                    <td className="p-3 text-left">Latest Base (TTM)</td>
                                    <td className="p-3 text-right font-mono">{formatCurrency(baseRev)}</td>
                                    <td className="p-3 text-right font-mono">{formatCurrency(basePat)}</td>
                                    <td className="p-3 text-right font-mono">{baseRev !== 0 ? ((basePat/baseRev)*100).toFixed(2) : 0}%</td>
                                </tr>
                                {rows.map((row, i) => (
                                    <tr key={i} className="hover:bg-slate-850/20">
                                        <td className="p-3 text-left font-semibold text-slate-400">{row.year}</td>
                                        <td className="p-3 text-right font-mono">{formatCurrency(row.revenue)}</td>
                                        <td className="p-3 text-right font-mono">{formatCurrency(row.pat)}</td>
                                        <td className="p-3 text-right font-mono text-blue-400 font-semibold">{row.margin.toFixed(2)}%</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
